id: dea:platform-service-nytimes-com-semantic-api-jt82p3
type: PlatformService
name: Semantic API (nytimes.com:semantic_api)
description: The Semantic API complements the Articles API. With the Semantic API,
  you get access to the long list of people, places, organizations and other locations,
  entities and descriptors that make up the controlled vocabulary used as metadata
  by The New York Times (sometimes referred to as Times Tags and used for Times Topics
  pages). The Semantic API uses concepts which are, by definition, terms in The New
  York Times controlled vocabulary. Like the way facets are used in the Articles API,
  concepts are a good way to uncover articles of interest in The New York Times archive,
  and at the same time, limit the scope and number of those articles. The Semantic
  API maps to external semantic data resources, in a fashion consistent with the idea
  of linked data. The Semantic API also provides combination and relationship information
  to other, similar concepts in The New York Times controlled vocabulary.
