type: PlatformService
name: CodeArtifact (amazonaws.com:codeartifact)
description: '<p> CodeArtifact is a fully managed artifact repository compatible with
  language-native package managers and build tools such as npm, Apache Maven, pip,
  and dotnet. You can use CodeArtifact to share packages with development teams and
  pull packages. Packages can be pulled from both public and CodeArtifact repositories.
  You can also create an upstream relationship between a CodeArtifact repository and
  another repository, which effectively merges their contents from the point of view
  of a package manager client. </p> <p> <b>CodeArtifact Components</b> </p> <p>Use
  the information in this guide to help you work with the following CodeArtifact components:</p>
  <ul> <li> <p> <b>Repository</b>: A CodeArtifact repository contains a set of <a
  href="https://docs.aws.amazon.com/codeartifact/latest/ug/welcome.html#welcome-concepts-package-version">package
  versions</a>, each of which maps to a set of assets, or files. Repositories are
  polyglot, so a single repository can contain packages of any supported type. Each
  repository exposes endpoints for fetching and publishing packages using tools like
  the <b> <code>npm</code> </b> CLI, the Maven CLI (<b> <code>mvn</code> </b>), Python
  CLIs (<b> <code>pip</code> </b> and <code>twine</code>), and NuGet CLIs (<code>nuget</code>
  and <code>dotnet</code>).</p> </li> <li> <p> <b>Domain</b>: Repositories are aggregated
  into a higher-level entity known as a <i>domain</i>. All package assets and metadata
  are stored in the domain, but are consumed through repositories. A given package
  asset, such as a Maven JAR file, is stored once per domain, no matter how many repositories
  it''s present in. All of the assets and metadata in a domain are encrypted with
  the same customer master key (CMK) stored in Key Management Service (KMS).</p> <p>Each
  repository is a member of a single domain and can''t be moved to a different domain.</p>
  <p>The domain allows organizational policy to be applied across multiple repositories,
  such as which accounts can access re'
