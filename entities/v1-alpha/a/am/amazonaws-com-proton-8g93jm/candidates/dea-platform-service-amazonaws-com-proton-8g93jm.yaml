type: PlatformService
name: AWS Proton (amazonaws.com:proton)
description: <p>This is the Proton Service API Reference. It provides descriptions,
  syntax and usage examples for each of the <a href="https://docs.aws.amazon.com/proton/latest/APIReference/API_Operations.html">actions</a>
  and <a href="https://docs.aws.amazon.com/proton/latest/APIReference/API_Types.html">data
  types</a> for the Proton service.</p> <p>The documentation for each action shows
  the Query API request parameters and the XML response.</p> <p>Alternatively, you
  can use the Amazon Web Services CLI to access an API. For more information, see
  the <a href="https://docs.aws.amazon.com/cli/latest/userguide/cli-chap-welcome.html">Amazon
  Web Services Command Line Interface User Guide</a>.</p> <p>The Proton service is
  a two-pronged automation framework. Administrators create service templates to provide
  standardized infrastructure and deployment tooling for serverless and container
  based applications. Developers, in turn, select from the available service templates
  to automate their application or service deployments.</p> <p>Because administrators
  define the infrastructure and tooling that Proton deploys and manages, they need
  permissions to use all of the listed API operations.</p> <p>When developers select
  a specific infrastructure and tooling set, Proton deploys their applications. To
  monitor their applications that are running on Proton, developers need permissions
  to the service <i>create</i>, <i>list</i>, <i>update</i> and <i>delete</i> API operations
  and the service instance <i>list</i> and <i>update</i> API operations.</p> <p>To
  learn more about Proton, see the <a href="https://docs.aws.amazon.com/proton/latest/userguide/Welcome.html">Proton
  User Guide</a>.</p> <p> <b>Ensuring Idempotency</b> </p> <p>When you make a mutating
  API request, the request typically returns a result before the asynchronous workflows
  of the operation are complete. Operations might also time out or encounter other
  server issues before they're complete, even if the request already returned a result
