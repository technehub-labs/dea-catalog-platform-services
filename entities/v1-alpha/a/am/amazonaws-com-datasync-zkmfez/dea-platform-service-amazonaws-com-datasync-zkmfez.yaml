name: AWS DataSync (amazonaws.com:datasync)
description: <fullname>DataSync</fullname> <p>DataSync is a managed data transfer
  service that makes it simpler for you to automate moving data between on-premises
  storage and Amazon Web Services storage services. You also can use DataSync to transfer
  data between other cloud providers and Amazon Web Services storage services.</p>
  <p>This API interface reference includes documentation for using DataSync programmatically.
  For complete information, see the <i> <a href="https://docs.aws.amazon.com/datasync/latest/userguide/what-is-datasync.html">DataSync
  User Guide</a> </i>.</p>
