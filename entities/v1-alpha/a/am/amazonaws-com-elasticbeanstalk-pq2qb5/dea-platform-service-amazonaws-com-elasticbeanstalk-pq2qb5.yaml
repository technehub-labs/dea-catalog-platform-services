name: AWS Elastic Beanstalk (amazonaws.com:elasticbeanstalk)
description: <fullname>AWS Elastic Beanstalk</fullname> <p>AWS Elastic Beanstalk makes
  it easy for you to create, deploy, and manage scalable, fault-tolerant applications
  running on the Amazon Web Services cloud.</p> <p>For more information about this
  product, go to the <a href="http://aws.amazon.com/elasticbeanstalk/">AWS Elastic
  Beanstalk</a> details page. The location of the latest AWS Elastic Beanstalk WSDL
  is <a href="https://elasticbeanstalk.s3.amazonaws.com/doc/2010-12-01/AWSElasticBeanstalk.wsdl">https://elasticbeanstalk.s3.amazonaws.com/doc/2010-12-01/AWSElasticBeanstalk.wsdl</a>.
  To install the Software Development Kits (SDKs), Integrated Development Environment
  (IDE) Toolkits, and command line tools that enable you to access the API, go to
  <a href="http://aws.amazon.com/tools/">Tools for Amazon Web Services</a>.</p> <p>
  <b>Endpoints</b> </p> <p>For a list of region-specific endpoints that AWS Elastic
  Beanstalk supports, go to <a href="https://docs.aws.amazon.com/general/latest/gr/rande.html#elasticbeanstalk_region">Regions
  and Endpoints</a> in the <i>Amazon Web Services Glossary</i>.</p>
