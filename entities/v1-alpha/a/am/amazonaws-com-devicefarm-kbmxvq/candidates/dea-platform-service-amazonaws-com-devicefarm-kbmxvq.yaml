name: AWS Device Farm (amazonaws.com:devicefarm)
description: <p>Welcome to the AWS Device Farm API documentation, which contains APIs
  for:</p> <ul> <li> <p>Testing on desktop browsers</p> <p> Device Farm makes it possible
  for you to test your web applications on desktop browsers using Selenium. The APIs
  for desktop browser testing contain <code>TestGrid</code> in their names. For more
  information, see <a href="https://docs.aws.amazon.com/devicefarm/latest/testgrid/">Testing
  Web Applications on Selenium with Device Farm</a>.</p> </li> <li> <p>Testing on
  real mobile devices</p> <p>Device Farm makes it possible for you to test apps on
  physical phones, tablets, and other devices in the cloud. For more information,
  see the <a href="https://docs.aws.amazon.com/devicefarm/latest/developerguide/">Device
  Farm Developer Guide</a>.</p> </li> </ul>
