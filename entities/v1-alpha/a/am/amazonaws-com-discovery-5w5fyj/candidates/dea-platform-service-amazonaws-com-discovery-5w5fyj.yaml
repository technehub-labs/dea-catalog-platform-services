name: AWS Application Discovery Service (amazonaws.com:discovery)
description: <fullname>Amazon Web Services Application Discovery Service</fullname>
  <p>Amazon Web Services Application Discovery Service helps you plan application
  migration projects. It automatically identifies servers, virtual machines (VMs),
  and network dependencies in your on-premises data centers. For more information,
  see the <a href="http://aws.amazon.com/application-discovery/faqs/">Amazon Web Services
  Application Discovery Service FAQ</a>. Application Discovery Service offers three
  ways of performing discovery and collecting data about your on-premises servers:</p>
  <ul> <li> <p> <b>Agentless discovery</b> is recommended for environments that use
  VMware vCenter Server. This mode doesn't require you to install an agent on each
  host. It does not work in non-VMware environments.</p> <ul> <li> <p>Agentless discovery
  gathers server information regardless of the operating systems, which minimizes
  the time required for initial on-premises infrastructure assessment.</p> </li> <li>
  <p>Agentless discovery doesn't collect information about network dependencies, only
  agent-based discovery collects that information.</p> </li> </ul> </li> </ul> <ul>
  <li> <p> <b>Agent-based discovery</b> collects a richer set of data than agentless
  discovery by using the Amazon Web Services Application Discovery Agent, which you
  install on one or more hosts in your data center.</p> <ul> <li> <p> The agent captures
  infrastructure and application information, including an inventory of running processes,
  system performance information, resource utilization, and network dependencies.</p>
  </li> <li> <p>The information collected by agents is secured at rest and in transit
  to the Application Discovery Service database in the cloud. </p> </li> </ul> </li>
  </ul> <ul> <li> <p> <b>Amazon Web Services Partner Network (APN) solutions</b> integrate
  with Application Discovery Service, enabling you to import details of your on-premises
  environment directly into Migration Hub without using the discovery connector or
  di
