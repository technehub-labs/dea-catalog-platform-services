description: '<fullname>AWS CodeCommit</fullname> <p>This is the <i>AWS CodeCommit
  API Reference</i>. This reference provides descriptions of the operations and data
  types for AWS CodeCommit API along with usage examples.</p> <p>You can use the AWS
  CodeCommit API to work with the following objects:</p> <p>Repositories, by calling
  the following:</p> <ul> <li> <p> <a>BatchGetRepositories</a>, which returns information
  about one or more repositories associated with your AWS account.</p> </li> <li>
  <p> <a>CreateRepository</a>, which creates an AWS CodeCommit repository.</p> </li>
  <li> <p> <a>DeleteRepository</a>, which deletes an AWS CodeCommit repository.</p>
  </li> <li> <p> <a>GetRepository</a>, which returns information about a specified
  repository.</p> </li> <li> <p> <a>ListRepositories</a>, which lists all AWS CodeCommit
  repositories associated with your AWS account.</p> </li> <li> <p> <a>UpdateRepositoryDescription</a>,
  which sets or updates the description of the repository.</p> </li> <li> <p> <a>UpdateRepositoryName</a>,
  which changes the name of the repository. If you change the name of a repository,
  no other users of that repository can access it until you send them the new HTTPS
  or SSH URL to use.</p> </li> </ul> <p>Branches, by calling the following:</p> <ul>
  <li> <p> <a>CreateBranch</a>, which creates a branch in a specified repository.</p>
  </li> <li> <p> <a>DeleteBranch</a>, which deletes the specified branch in a repository
  unless it is the default branch.</p> </li> <li> <p> <a>GetBranch</a>, which returns
  information about a specified branch.</p> </li> <li> <p> <a>ListBranches</a>, which
  lists all branches for a specified repository.</p> </li> <li> <p> <a>UpdateDefaultBranch</a>,
  which changes the default branch for a repository.</p> </li> </ul> <p>Files, by
  calling the following:</p> <ul> <li> <p> <a>DeleteFile</a>, which deletes the content
  of a specified file from a specified branch.</p> </li> <li> <p> <a>GetBlob</a>,
  which returns the base-64 encoded content of an '
