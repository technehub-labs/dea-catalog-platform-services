name: AWS Key Management Service (amazonaws.com:kms)
description: '<fullname>Key Management Service</fullname> <p>Key Management Service
  (KMS) is an encryption and key management web service. This guide describes the
  KMS operations that you can call programmatically. For general information about
  KMS, see the <a href="https://docs.aws.amazon.com/kms/latest/developerguide/"> <i>Key
  Management Service Developer Guide</i> </a>.</p> <note> <p>KMS has replaced the
  term <i>customer master key (CMK)</i> with <i>KMS key</i> and <i>KMS key</i>. The
  concept has not changed. To prevent breaking changes, KMS is keeping some variations
  of this term.</p> <p>Amazon Web Services provides SDKs that consist of libraries
  and sample code for various programming languages and platforms (Java, Ruby, .Net,
  macOS, Android, etc.). The SDKs provide a convenient way to create programmatic
  access to KMS and other Amazon Web Services services. For example, the SDKs take
  care of tasks such as signing requests (see below), managing errors, and retrying
  requests automatically. For more information about the Amazon Web Services SDKs,
  including how to download and install them, see <a href="http://aws.amazon.com/tools/">Tools
  for Amazon Web Services</a>.</p> </note> <p>We recommend that you use the Amazon
  Web Services SDKs to make programmatic API calls to KMS.</p> <p>If you need to use
  FIPS 140-2 validated cryptographic modules when communicating with Amazon Web Services,
  use the FIPS endpoint in your preferred Amazon Web Services Region. For more information
  about the available FIPS endpoints, see <a href="https://docs.aws.amazon.com/general/latest/gr/kms.html#kms_region">Service
  endpoints</a> in the Key Management Service topic of the <i>Amazon Web Services
  General Reference</i>.</p> <p>All KMS API calls must be signed and be transmitted
  using Transport Layer Security (TLS). KMS recommends you always use the latest supported
  TLS version. Clients must also support cipher suites with Perfect Forward Secrecy
  (PFS) such as Ephemeral Diffie-Hellman (DHE) or Elliptic '
