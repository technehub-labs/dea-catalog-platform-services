type: PlatformService
name: Redshift Data API Service (amazonaws.com:redshift-data)
description: <p>You can use the Amazon Redshift Data API to run queries on Amazon
  Redshift tables. You can run SQL statements, which are committed if the statement
  succeeds. </p> <p>For more information about the Amazon Redshift Data API and CLI
  usage examples, see <a href="https://docs.aws.amazon.com/redshift/latest/mgmt/data-api.html">Using
  the Amazon Redshift Data API</a> in the <i>Amazon Redshift Management Guide</i>.
  </p>
