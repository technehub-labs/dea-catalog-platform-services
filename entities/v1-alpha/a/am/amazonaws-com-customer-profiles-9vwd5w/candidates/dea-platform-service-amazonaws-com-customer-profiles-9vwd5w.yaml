name: Amazon Connect Customer Profiles (amazonaws.com:customer-profiles)
description: <fullname>Amazon Connect Customer Profiles</fullname> <p>Amazon Connect
  Customer Profiles is a unified customer profile for your contact center that has
  pre-built connectors powered by AppFlow that make it easy to combine customer information
  from third party applications, such as Salesforce (CRM), ServiceNow (ITSM), and
  your enterprise resource planning (ERP), with contact history from your Amazon Connect
  contact center. If you're new to Amazon Connect, you might find it helpful to review
  the <a href="https://docs.aws.amazon.com/connect/latest/adminguide/">Amazon Connect
  Administrator Guide</a>.</p>
