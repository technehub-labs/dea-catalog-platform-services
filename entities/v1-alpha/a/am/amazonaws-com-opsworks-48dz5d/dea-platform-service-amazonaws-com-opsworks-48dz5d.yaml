description: <fullname>AWS OpsWorks</fullname> <p>Welcome to the <i>AWS OpsWorks Stacks
  API Reference</i>. This guide provides descriptions, syntax, and usage examples
  for AWS OpsWorks Stacks actions and data types, including common parameters and
  error codes. </p> <p>AWS OpsWorks Stacks is an application management service that
  provides an integrated experience for overseeing the complete application lifecycle.
  For information about this product, go to the <a href="http://aws.amazon.com/opsworks/">AWS
  OpsWorks</a> details page. </p> <p> <b>SDKs and CLI</b> </p> <p>The most common
  way to use the AWS OpsWorks Stacks API is by using the AWS Command Line Interface
  (CLI) or by using one of the AWS SDKs to implement applications in your preferred
  language. For more information, see:</p> <ul> <li> <p> <a href="https://docs.aws.amazon.com/cli/latest/userguide/cli-chap-welcome.html">AWS
  CLI</a> </p> </li> <li> <p> <a href="https://docs.aws.amazon.com/AWSJavaSDK/latest/javadoc/com/amazonaws/services/opsworks/AWSOpsWorksClient.html">AWS
  SDK for Java</a> </p> </li> <li> <p> <a href="https://docs.aws.amazon.com/sdkfornet/latest/apidocs/html/N_Amazon_OpsWorks.htm">AWS
  SDK for .NET</a> </p> </li> <li> <p> <a href="https://docs.aws.amazon.com/aws-sdk-php-2/latest/class-Aws.OpsWorks.OpsWorksClient.html">AWS
  SDK for PHP 2</a> </p> </li> <li> <p> <a href="http://docs.aws.amazon.com/sdkforruby/api/">AWS
  SDK for Ruby</a> </p> </li> <li> <p> <a href="http://aws.amazon.com/documentation/sdkforjavascript/">AWS
  SDK for Node.js</a> </p> </li> <li> <p> <a href="http://docs.pythonboto.org/en/latest/ref/opsworks.html">AWS
  SDK for Python(Boto)</a> </p> </li> </ul> <p> <b>Endpoints</b> </p> <p>AWS OpsWorks
  Stacks supports the following endpoints, all HTTPS. You must connect to one of the
  following endpoints. Stacks can only be accessed or managed within the endpoint
  in which they are created.</p> <ul> <li> <p>opsworks.us-east-1.amazonaws.com</p>
