type: PlatformService
name: Amazon EMR (amazonaws.com:elasticmapreduce)
description: Amazon EMR is a web service that makes it easier to process large amounts
  of data efficiently. Amazon EMR uses Hadoop processing combined with several Amazon
  Web Services services to do tasks such as web indexing, data mining, log file analysis,
  machine learning, scientific simulation, and data warehouse management.
