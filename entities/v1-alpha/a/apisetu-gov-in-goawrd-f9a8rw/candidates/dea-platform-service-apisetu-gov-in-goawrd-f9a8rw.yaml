name: Goa Water Resources Department, Goa (apisetu.gov.in:goawrd)
description: Goa WRD (https://goawrd.gov.in/) is the official departmental portal
  of the Water Resources Department, Govt. of Goa, through which citizens can avail
  time bound service being offered by the department. Certificates issued by it (e.g.
  Contractor Enlistment, Well Registration etc) are made available in citizens' DigiLocker
  accounts.
