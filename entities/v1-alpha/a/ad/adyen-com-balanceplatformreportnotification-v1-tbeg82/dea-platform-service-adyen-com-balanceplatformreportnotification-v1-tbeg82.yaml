id: dea:platform-service-adyen-com-balanceplatformreportnotification-v1-tbeg82
type: PlatformService
name: Report webhooks (adyen.com:BalancePlatformReportNotification-v1)
description: Adyen sends notifications through webhooks to inform your system that
  reports were generated and are ready to be downloaded. You can download reports
  programmatically by making an HTTP GET request, or manually from your [Balance Platform
  Customer Area](https://balanceplatform-test.adyen.com/balanceplatform).
