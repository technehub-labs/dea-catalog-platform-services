id: dea:platform-service-azure-com-machinelearning-commitmentplans-btp29s
type: PlatformService
name: Azure ML Commitment Plans Management Client (azure.com:machinelearning-commitmentPlans)
description: These APIs allow end users to operate on Azure Machine Learning Commitment
  Plans resources and their child Commitment Association resources. They support CRUD
  operations for commitment plans, get and list operations for commitment associations,
  moving commitment associations between commitment plans, and retrieving commitment
  plan usage history.
