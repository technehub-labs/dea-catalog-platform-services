id: dea:platform-service-azure-com-machinelearning-webservices-7sha67
type: PlatformService
name: Azure ML Web Services Management Client (azure.com:machinelearning-webservices)
description: These APIs allow end users to operate on Azure Machine Learning Web Services
  resources. They support the following operations:<ul><li>Create or update a web
  service</li><li>Get a web service</li><li>Patch a web service</li><li>Delete a web
  service</li><li>Get All Web Services in a Resource Group </li><li>Get All Web Services
  in a Subscription</li><li>Get Web Services Keys</li></ul>
