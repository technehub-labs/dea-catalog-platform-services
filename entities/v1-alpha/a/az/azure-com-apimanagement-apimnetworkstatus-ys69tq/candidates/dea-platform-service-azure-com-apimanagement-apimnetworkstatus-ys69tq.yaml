type: PlatformService
name: ApiManagementClient (azure.com:apimanagement-apimnetworkstatus)
description: Use these REST APIs for getting the network connectivity status of your
  Azure API Management deployment. When the API Management service is deployed inside
  a Virtual Network, it needs to have access to other Azure resources it depends on.
  This also gives details about the DNS Servers visible to Azure API Management deployment.
