id: dea:platform-service-azure-com-cognitiveservices-contentmoderator-dpx5cg
type: PlatformService
name: Content Moderator Client (azure.com:cognitiveservices-ContentModerator)
description: You use the API to scan your content as it is generated. Content Moderator
  then processes your content and sends the results along with relevant information
  either back to your systems or to the built-in review tool. You can use this information
  to take decisions e.g. take it down, send to human judge, etc. When using the API,
  images need to have a minimum of 128 pixels and a maximum file size of 4MB. Text
  can be at most 1024 characters long. If the content passed to the text API or the
  image API exceeds the size limits, the API will return an error code that informs
  about the issue.
