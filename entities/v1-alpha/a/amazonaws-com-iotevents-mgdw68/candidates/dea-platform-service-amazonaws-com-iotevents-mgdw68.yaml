id: dea:platform-service-amazonaws-com-iotevents-mgdw68
type: PlatformService
name: AWS IoT Events (amazonaws.com:iotevents)
description: AWS IoT Events monitors your equipment or device fleets for failures
  or changes in operation, and triggers actions when such events occur. You can use
  AWS IoT Events API operations to create, read, update, and delete inputs and detector
  models, and to list their versions.
