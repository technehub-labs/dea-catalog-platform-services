type: PlatformService
name: Identity API (apiz.ebay.com:commerce-identity)
description: <span class="tablenote"><b>Note:</b> Not all the account related fields
  are returned for an authenticated user. The fields returned in the response are
  controlled by the scopes and are available only to select developers approved by
  business units.</span><br /><br />Retrieves the authenticated user's account profile
  information. It can be used to let users log into your app or site using eBay, which
  frees you from needing to store and protect user's PII (Personal Identifiable Information)
  data.
