type: PlatformService
name: Account API (api.ebay.com:sell-account)
description: The <b>Account API</b> gives sellers the ability to configure their eBay
  seller accounts, including the seller's policies (eBay business policies and seller-defined
  custom policies), opt in and out of eBay seller programs, configure sales tax tables,
  and get account information. <br/><br/>For details on the availability of the methods
  in this API, see <a href="/api-docs/sell/account/overview.html#requirements">Account
  API requirements and restrictions</a>.
