description: 'Welcome to the SMS API. You can use this API to access all SMS API endpoints.
  ## Base URL The base URL for all API requests is `https://unify.apideck.com` We
  also provide a [Mock API](https://developers.apideck.com/mock-api) that can be used
  for testing purposes: `https://mock-api.apideck.com` ## Headers Custom headers that
  are expected as part of the request. Note that [RFC7230](https://tools.ietf.org/html/rfc7230)
  states header names are case insensitive. | Name | Type | Required | Description
  | | --------------------- | ------- | -------- | --------------------------------------------------------------------------------------------------------------------------------------------------------------
  | | x-apideck-consumer-id | String | Yes | The id of the customer stored inside
  Apideck Vault. This can be a user id, account id, device id or whatever entity that
  can have integration within your app. | | x-apideck-service-id | String | No | Describe
  the service you want to call (e.g., pipedrive). Only needed when a customer has
  activated multiple integrations for the same Unified API. | | x-apideck-raw | Boolean
  | No | Include raw response. Mostly used for debugging purposes. | | x-apideck-app-id
  | String | Yes | The application id of your Unify application. Available at https://app.apideck.com/unify/api-keys.
  | | Authorization | String | Yes | Bearer API KEY | ## Authorization You can interact
  with the API through the authorization methods below. <!-- ReDoc-Inject: <security-definitions>
  --> ## Pagination All API resources have support for bulk retrieval via list APIs.
