name: Apacta (apacta.com)
description: 'API for a tool to craftsmen used to register working hours, material
  usage and quality assurance. # Endpoint The endpoint `https://app.apacta.com/api/v1`
  should be used to communicate with the API. API access is only allowed with SSL
  encrypted connection (https). # Authentication URL query authentication with an
  API key is used, so appending `?api_key={api_key}` to the URL where `{api_key}`
  is found within Apacta settings is used for authentication # Pagination If the endpoint
  returns a `pagination` object it means the endpoint supports pagination - currently
  it''s only possible to change pages with `?page={page_number}` but implementing
  custom page sizes are on the road map. # Search/filter Is experimental but implemented
  in some cases - see the individual endpoints'' docs for further explanation. # Ordering
  Is currently experimental, but on some endpoints it''s implemented on URL querys
  so eg. to order Invoices by `invoice_number` appending `?sort=Invoices.invoice_number&direction=desc`
  would sort the list descending by the value of `invoice_number`. # Associations
  Is currently implemented on an experimental basis where you can append eg. `?include=Contacts,Projects`
  to the `/api/v1/invoices/` endpoint to embed `Contact` and `Project` objects directly.
  # Project Files Currently project files can be retrieved from two endpoints. `/projects/{project_id}/files`
  handles files uploaded from wall posts or forms. `/projects/{project_id}/project_files`
  allows uploading and showing files, not belonging to specific form or wall post.
  # Errors/Exceptions ## 422 (Validation) Write something about how the `errors` object
  contains keys with the properties that failes validation like: ``` { "success":
  false, "data": { "code": 422, "url": "/api/v1/contacts?api_key=5523be3b-30ef-425d-8203-04df7caaa93a",
  "message": "A validation error occurred", "errorCount": 1, "errors": { "contact_types":
  [ ## Property name that failed validation "Contacts must have at least one contact
  type" ## Mes'
