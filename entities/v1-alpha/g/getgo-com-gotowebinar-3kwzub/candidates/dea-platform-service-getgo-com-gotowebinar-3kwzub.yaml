type: PlatformService
name: GoToWebinar (getgo.com:gotowebinar)
description: The GoToWebinar API provides seamless integration of webinar registrant
  and attendee data into your existing infrastructure or third-party applications.
  The ability to register participants, as well as pull lists of registrants and attendees
  for a webinar, allows organizers to manage the flow of information between their
  primary applications without manual intervention.
