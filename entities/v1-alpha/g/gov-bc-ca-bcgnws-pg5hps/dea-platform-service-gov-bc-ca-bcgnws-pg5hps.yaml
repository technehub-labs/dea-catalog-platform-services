name: BC Geographical Names Web Service - REST API (gov.bc.ca:bcgnws)
description: This REST API provides searchable access to information about geographical
  names in the province of British Columbia, including name status and details about
  the corresponding geographic feature. Please note that you may experience issues
  when submitting requests to the delivery or test environment if using this [OpenAPI
  specification](https://github.com/bcgov/api-specs) in other API console viewers.
