name: DriveBC's Open511 API (gov.bc.ca:open511)
description: This API is DriveBC's implementation of the Open511 specification. It
  provides information about known road events (traffic accidents, construction, etc.)
  in British Columbia, Canada. Please note that you may experience issues when submitting
  requests to the delivery or test environment if using this [OpenAPI specification](https://github.com/bcgov/api-specs)
  in other API console viewers.
