id: dea:platform-service-gov-bc-ca-geocoder-g8k4bj
type: PlatformService
name: Geocoder REST API (gov.bc.ca:geocoder)
description: This API represents address cleaning, correction, completion, geocoding,
  reverse geocoding, and proximity resources for intersection addresses, physical
  addresses and their occupants in British Columbia. Please read our [data collection
  notice](https://github.com/bcgov/api-specs/blob/master/COLLECTION_NOTICE.md#collection-notice).
  Please note that you may experience issues when submitting requests to the delivery
  or test environment if using this [OpenAPI specification](https://github.com/bcgov/api-specs)
  in other API console viewers. [API keys](https://api.gov.bc.ca/devportal/api-directory/273)
  are unique and can be acquired with a GitHub or IDIR account. **Notification:**
  If you have applications or web pages that link to the BC Address Geocoder you must
  use the following URL. *https://geocoder.api.gov.bc.ca* Please note that the following
  URLs were deprecated in September 2018 [More Details](https://www2.gov.bc.ca/gov/content?id=103ADC5A956842828554238DEF28D6E5).
  - http://apps.gov.bc.ca/pub/geocoder - https://apps.gov.bc.ca/pub/geocoder \ \
