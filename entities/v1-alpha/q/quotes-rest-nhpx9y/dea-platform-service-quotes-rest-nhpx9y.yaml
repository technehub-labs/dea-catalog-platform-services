name: They Said So Quotes API (quotes.rest)
description: They Said So Quotes API offers a complete feature rich REST API access
  to its quotes platform. This is the documentation for the world famous [quotes API](https://theysaidso.com/api).
  If you are a subscriber and you are trying this from a console add 'X-TheySaidSo-Api-Secret'
  header and add your api key as the header value. You can test and play with the
  API right here on this web page. For using the private end points and subscribing
  to the API please visit https://theysaidso.com/api.
