description: '<span style="color:green">**Is this your first time here? Please check
  out our [introduction to Loket (API)](./Introduction)**</span> **The initial loading
  time of this developer portal may be very long due to the large number of endpoints
  designs being rendered when loading the page. We are looking into an alternative
  solution but for now please bear in mind.** # General The Loket.nl API is a RESTful
  API that exposes the data and features of the Loket.nl platform. The API accepts
  and returns JSON and can only be accessed by registered users. This documentation
  describes version 2 of the API. Are you looking to partner up and start building
  an integration based on the Loket RESTful API? Please check out the steps for partners
  on our [website](https://www.loket.nl/koppelingen/koppelen-met-loket/) . Have you
  received your client and user credentials from us? Check out the following Postman
  collection to help you start making your first API calls on our acceptance environment.
  We would recommend to install the Postman desktop app. [![Run in Postman](https://run.pstmn.io/button.svg)](https://god.gw.postman.com/run-collection/19604713-42728000-2df3-4ff0-908e-dc6ab410990c?action=collection%2Ffork&collection-url=entityId%3D19604713-42728000-2df3-4ff0-908e-dc6ab410990c%26entityType%3Dcollection%26workspaceId%3Ddde2c409-9fb2-4f40-9981-f937f73750ea#?env%5BLoket.nl%20Test%20Environment%'
