type: PlatformService
name: Daymet Single Pixel Extraction Tool API (ornl.gov:daymet)
description: Welcome to the Daymet Single Pixel Extraction Tool API. You can use this
  API to download daily surface data within the Daymet database in a `csv` or `json`
  format for a single point. This API allows users to query a single geographic point
  by latitude and longitude in decimal degrees. A routine is executed that translates
  the (lon, lat) coordinates into projected Daymet (x,y) Lambert Conformal Coordinates.
  These coordinates are used to access the Daymet database of daily interpolated surface
  weather variables. Daily data from the nearest 1 km x 1 km Daymet grid cell are
  extracted from the database. If you would like to learn how to automate the download
  of multiple locations for the Daymet Single Pixel Extraction Tool, click [here](https://github.com/ornldaac/daymet-single-pixel-batch).
