type: PlatformService
name: Turbine Labs API (turbinelabs.io)
description: 'The Turbine Labs API provides CRUD operations for core object types,
  and is mostly RESTy. The easiest way to interact with the API is with [tbnctl](https://docs.turbinelabs.io/advanced/tbnctl.html).
  If you want to make direct HTTP calls, however, you can obtain an access token using
  tbnctl, and then pass it in the Authorization header, prefixed by `Token `: ```console
  curl -H "Authorization: Token <access token>" https://api.turbinelabs.io/v1.0/cluster
  ```'
