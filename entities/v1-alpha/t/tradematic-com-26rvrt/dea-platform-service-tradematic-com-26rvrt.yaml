name: Tradematic Cloud API (tradematic.com)
description: '### Overview Tradematic Cloud is a trading infrastructure for building
  investment services. It’s a trading engine + API + ready-made adapters to stock
  and forex brokers, crypto exchanges, and market data providers. You can use it as
  a cloud API, or you can deploy it on your servers. ### How to use Tradematic Cloud
  API Sign up at [tradematic.cloud](https://tradematic.cloud). After signing up, you
  will receive your API key. ### Authorization Add the ''X-API-KEY'' header with your
  API key to each request. ### Examples of writing code with Tradematic Cloud API
  Examples are available at [tradematic.cloud](https://tradematic.cloud). ### Swagger
  (.yaml) File Swagger (.yaml) file can be found [here](http://tradematic.cloud/sdk/swagger.yaml).'
