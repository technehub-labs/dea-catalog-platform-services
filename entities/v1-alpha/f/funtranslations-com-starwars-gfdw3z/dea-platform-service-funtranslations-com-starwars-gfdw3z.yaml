name: Starwars Translations API (funtranslations.com:starwars)
description: Funtranslations Starwars API gives access to the full set of starwars
  language translations available at funtranslations.com so that you can integrate
  them in your workflow or an app. [Click here to get details and subscribe](http://funtranslations.com/api/starwars)
  . You can also subscribe to individual translators. Here are the details. Ever wonder
  how to talk like Yoda? Well, use our API and let your APP/webpage speak like Yoda
  too.[Click here to subscribe](http://funtranslations.com/api/yoda) Sith Translator
  API. [Click here to subscribe](http://funtranslations.com/api/sith) Cheunh Translator
  API. [Click here to subscribe](http://funtranslations.com/api/cheunh) Huttese Translator
  API. [Click here to subscribe](http://funtranslations.com/api/huttese) Mandalorian
  Translator API. [Click here to subscribe](http://funtranslations.com/api/mandalorian)
  Gungan Translator API. [Click here to subscribe](http://funtranslations.com/api/gungan)
