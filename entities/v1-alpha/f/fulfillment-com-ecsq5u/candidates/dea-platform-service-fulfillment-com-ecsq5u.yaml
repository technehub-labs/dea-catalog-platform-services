name: Fulfillment.com APIv2 (fulfillment.com)
description: 'Welcome to our current iteration of our REST API. While we encourage
  you to upgrade to v2.0 we will continue support for our [SOAP API](https://github.com/fulfillment/soap-integration).
  # Versioning The Fulfillment.com (FDC) REST API is version controlled and backwards
  compatible. We have many future APIs scheduled for publication within our v2.0 spec
  so please be prepared for us to add data nodes in our responses, however, we will
  not remove knowledge from previously published APIs. #### A Current Response ```javascript
  { id: 123 } ``` #### A Potential Future Response ```javascript { id: 123, reason:
  "More Knowledge" } ``` # Getting Started We use OAuth v2.0 to authenticate clients,
  you can choose [implicit](https://oauth.net/2/grant-types/implicit/) or [password](https://oauth.net/2/grant-types/password/)
  grant type. To obtain an OAuth `client_id` and `client_secret` contact your account
  executive. **Tip**: Generate an additional login and use those credentials for your
  integration so that changes are accredited to that "user". You are now ready to
  make requests to our other APIs by filling your `Authorization` header with `Bearer
  {access_token}`. ## Perpetuating Access Perpetuating access to FDC without storing
  your password locally can be achieved using the `refresh_token` returned by [POST
  /oauth/access_token](#operation/generateToken). A simple concept to achieve this
  is outlined below. 1. Your application/script will ask you for your `username` and
  `password`, your `client_id` and `client_secret` will be accessible via a DB or
  ENV. 2. [Request an access_token](#operation/generateToken) + Your function should
  be capable of formatting your request for both a `grant_type` of \"password\" (step
  1) and \"refresh_token\" (step 4). 3. Store the `access_token` and `refresh_token`
  so future requests can skip step 1 4. When the `access_token` expires request anew
  using your `refresh_token`, replace both tokens in local storage. + If this fails
  you will have to revert t'
