type: PlatformService
name: rv API (sheetlabs.com:rig-veda)
description: '# Introduction This API returns information about all of the verses
  in Rig Veda. The results are JSON objects that contain the name of the god, poet,
  and meter of the verses in Rig Veda, the category of the god and the poet, and the
  _mandal_ and _sukta_ number. The API uses the Swagger 2.0 specification. # Authentication
  This is an open API. # Try it out This sandbox can be used to get data for only
  one kind of resource, that is, to fetch the data for a category being sung to. The
  remaining resources work a similar fashion. For details, see the reference documentation.'
