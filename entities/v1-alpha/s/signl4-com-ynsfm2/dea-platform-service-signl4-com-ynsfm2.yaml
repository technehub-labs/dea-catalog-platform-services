id: dea:platform-service-signl4-com-ynsfm2
type: PlatformService
name: SIGNL4 API (signl4.com)
description: '<p>Use our API for systems integration or to build your own use cases.
  Sample scenarios include but are not limited to:</p><ul><li>2-way integration: Triggering
  of Signls and updates in the third party systems when alert state changes occur</li><li>Retrieving
  alarms for logging purposes</li><li>Calendar integrations: Creation and management
  of on-call duties</li><li>Punch users in and out based on external calendars</li><li>etc.</li></ul><p>AUTHENTICATION<br>Using
  the API requires an API key, which you can generate in the SIGNL4 portal under ''Developers''.<br>This
  key must then be specified in a special header in every HTTP request.<br>This header
  is called <b style=''color:#F8B41F''>X-S4-Api-Key</b>.<br><br>The base URL of the
  API is <a rel=''noopener noreferrer'' target=''_blank'' href=''https://connect.signl4.com/api/''>https://connect.signl4.com/api/</a>.<br>Copyright
  © Derdack GmbH<br></p>'
