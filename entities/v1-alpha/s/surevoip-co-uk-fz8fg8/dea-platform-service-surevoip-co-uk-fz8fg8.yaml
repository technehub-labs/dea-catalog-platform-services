name: The SureVoIP RESTful API (surevoip.co.uk)
description: '# Introduction Welcome to the SureVoIP RESTful hypermedia API (sometimes
  known as a VoIP REST API, Telecom REST API, SIP API, Hypermedia API or just VoIP
  API.) The SureVoIP API is a way for you to automate your interaction with the SureVoIP
  platforms. With the API, you can create your own scripts, applications or mashups
  which can: * List calls * create customers * search numbers * provision numbers
  * send SMS texts * create outbound calls * schedule announcements * schedule call
  hangups with an announcement * subscribe to events/alerts * track calls * retrieve
  invoices * grab your SIP details * check your IP address * be 100% self-sufficient
  * and much more!'
