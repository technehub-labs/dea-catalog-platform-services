name: Public Api (combell.com)
description: '# Introduction This API allows resellers to manage their resources in
  a simple, programmatic way using HTTP requests. # Conventions ## Requests The API
  supports different methods depending on the required action. | Method | Description
  | --- | --- | GET | Retrieve resources in a collection or get a single resource.<br/>Getters
  will never have any effect on the queried resources. | POST | Create a new resource
  in a collection. | PUT | Update an existing resource with its new representation.
  | DELETE | Delete an existing resource. ## HTTP status codes The API will reply
  with different HTTP statuscodes: | StatusCode | Description | --- | --- | 200 OK
  | The requests was processed and you receive data as a result. | 201 CREATED | The
  resource has been created. Either the Location header contains a link to the created
  resource, or links are being returned in the response body. The applied method will
  be indicated in the documentation. | 202 ACCEPTED | The request has been validated
  and accepted. Because we need to do some background processing prior to returning
  the result, we cannot send back a useful representation. | 204 NOCONTENT | The request
  has been processed, but no details can be returned. | 400 BADREQUEST | Your request
  is malformed. | 401 UNAUTHORIZED | You are not authorized. Follow the instructions
  in the Authorization documentation. | 403 FORBIDDEN | Access to the resource or
  operation is not allowed. | 404 NOTFOUND | The resource cannot be found. | 410 GONE
  | The resource is permanently no longer available. | 429 TOOMANYREQUESTS | The ratelimit
  has been exceeded. Please refer to the documentation on rate limiting for more details.
  | 500 INTERNALSERVERERROR | An error occurred during the processing of the request.
  The error is unexpected and most likely due to a bug in the api. In the event of
  a problem, the body of the response will usually contain an errorcode and errormessage.
  In rare cases additional details about the error are reported. Errorcodes 400-4'
