id: dea:platform-service-cisco-com-ymkss8
type: PlatformService
name: Cisco PSIRT openVuln API (cisco.com)
description: 'The Cisco Product Security Incident Response Team (PSIRT) openVuln API
  is a RESTful API that allows customers to obtain Cisco Security Vulnerability information
  in different machine-consumable formats. APIs are important for customers because
  they allow their technical staff and programmers to build tools that help them do
  their job more effectively (in this case, to keep up with security vulnerability
  information). For more information about the Cisco PSIRT openVuln API visit https://developer.cisco.com/site/PSIRT/discover/overview
  For detail steps on how to use the API go to:https://developer.cisco.com/site/PSIRT/get-started/getting-started.gsp
  This is a beta release of a swagger YAML for the Cisco PSIRT openVuln API To access
  the API sign in with your Cisco CCO account at http://apiconsole.cisco.com and register
  an application to recieve a client_id and a client_secret You can then get your
  token using curl or any other method you prefer. ''curl -s -k -H "Content-Type:
  application/x-www-form-urlencoded" -X POST -d "client_id=<your_client_id>" -d "client_secret=<your_client_secret>"
  -d "grant_type=client_credentials" https://cloudsso.cisco.com/as/token.oauth2''
  You will receive an access token as demonstrated in the following example: ''{"access_token":"I7omWtBDAieSiUX3shOxNJfuy4J6","token_type":"Bearer","expires_in":3599}''
  In Swagger, click on Change Authentication enter the text "I7omWtBDAieSiUX3shOxNJfuy4J6"
  (which is the token you received) then click on "Try this operation"'
