name: ContentGroove API (contentgroove.com)
description: '# Overview The ContentGroove Developer API enables you to add the power
  of ContentGroove''s video AI to your own applications and workflows. Webhooks are
  a way for ContentGroove to send video information to your application, to update
  your system and/or trigger other business processes. You can use Webhooks and the
  Developer API separately or together. # Getting Started with Webhooks - Sign up
  for an account at [app.contentgroove.com](https://app.contentgroove.com) - Read
  "Using Webhooks" on the [API Reference page](https://developers.contentgroove.com/api_reference)
  - Visit the [Webhooks page](https://app.contentgroove.com/webhook_subscriptions)
  and create a new webhook # Using Webhooks Webhooks, also known as callbacks, are
  a way for ContentGroove to notify your application as soon as possible after an
  event has occurred in ContentGroove. For example after a media completes processing,
  ContentGroove can use a webhook to notify your application with information about
  the video: Suggested clips, transcription, and so on. You can use the information
  sent to update your system and/or use the webhook to trigger other business processes.
  The webhook request is sent as an HTTP POST containing a payload of JSON-formatted
  data. For the details of the payload format see the "CALLBACKS" sections below.
  When your application receives the webhook request, it must respond with a 200 HTTP
  status code (success). If a 200 HTTP status code is not returned, ContentGroove
  will assume that the webhook was not delivered and will retry a limited number of
  times, using an exponential backoff algorithm. ContentGroove makes a best effort
  to attempt to send the webhook at least once. Applications receiving webhooks must
  tolerate the possibility of a single webhook payload being sent more than once (idempotent
  behavior). Applications receiving webhooks should tolerate the possibility that
  a webhook could not be delivered (for example your application was down when delivery
  was attempted). # G'
