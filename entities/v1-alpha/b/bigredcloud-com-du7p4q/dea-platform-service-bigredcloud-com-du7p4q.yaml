description: '<div style=''line-height: 30px;''> <strong>Welcome to the Big Red Cloud
  API</strong><br/> This API enables programmatic access to Big Red Cloud data.<br/>
  We have used Swagger to auto generate the API documentation on this page, and it
  also enables direct interaction with the API in this page. <br/> To get started,
  you will require an API Key - check out our guide at <a target=''_blank'' href=''https://www.bigredcloud.com/support/generating-api-key-guide/''>https://www.bigredcloud.com/support/generating-api-key-guide/</a>
  for information on how to get one. <br/> Use the ''Enter API Key'' button below
  to enter your API key and start interacting with your Big Red Cloud data right on
  this page. <br/> The API key will be stored in your browsers local storage for convenience,
  but you will be able to delete it at any time if you wish. <br/> For additional
  information on the API, check out our support article at <a target=''_blank'' href=''https://www.bigredcloud.com/support/api/''>https://www.bigredcloud.com/support/api/</a><br/>
  </div>'
