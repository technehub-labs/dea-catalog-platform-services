name: Braze Endpoints (braze.com)
description: '# Braze API Overview Braze provides a high performance REST API to allow
  you to track users, send messages, export data, and more. A REST API is a way to
  programmatically transfer information over the web using a predefined schema. Braze
  has created many different endpoints with specific requirements that will perform
  various actions and/or return various data. API access is done using HTTPS web requests
  to your company''s REST API endpoint (this will correspond to your Dashboard URL
  as shown in the table below). Customers using Braze''s EU database should use `https://rest.fra-01.braze.eu/`.
  For more information on REST API endpoints for customers using Braze''s EU database
  see our [EU/US Implementation Differences documentation](https://www.braze.com/docs/developer_guide/eu01_us3_sdk_implementation_differences/overview/).
  ## Braze Instances Instance | Dashboard URL | REST Endpoint ----------- |----------------
  | -------------------- US-01 | `https://dashboard.braze.com` or<br> `https://dashboard-01.braze.com`
  | `https://rest.iad-01.braze.com` US-02 | `https://dashboard-02.braze.com` | `https://rest.iad-02.braze.com`
  US-03 | `https://dashboard-03.braze.com` | `https://rest.iad-03.braze.com` US-04
  | `https://dashboard-04.braze.com` | `https://rest.iad-04.braze.com` US-06 | `https://dashboard-06.braze.com`
  | `https://rest.iad-06.braze.com` EU-01 | `https://dashboard.braze.eu` or<br> `https://dashboard-01.braze.eu`
  | `https://rest.fra-01.braze.eu` # Using Braze''s Postman Collection If you have
  a Postman account (MacOS, Windows, and Linux versions can be downloaded from their
  website located [here](https://www.getpostman.com)), you can go to our Postman documentation
  and click the orange `Run in Postman` button in the top, right corner. This will
  allow you to [create an environment](#setting-up-your-postman-environment), as well
  as edit the available `POST` and `GET` requests to suit your own needs. ## Setting
  Up Your Postman Environment The Braze Postman Collection uses '
