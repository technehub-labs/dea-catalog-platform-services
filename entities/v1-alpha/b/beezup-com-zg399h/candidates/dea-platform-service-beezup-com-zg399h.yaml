name: BeezUP Merchant API (beezup.com)
description: '# The REST API of BeezUP system ## Overview The REST APIs provide programmatic
  access to read and write BeezUP data. Basically, with this API you will be able
  to do everything like you were with your browser on https://go.beezup.com ! The
  main features are: - Register and manage your account - Create and manage and share
  your stores with your friends/co-workers. - Import your product catalog and schedule
  the auto importation - Search the channels your want to use - Configure your channels
  for your catalogs to export your product information: - cost and general settings
  - category and columns mappings - your will be able to create and manage your custom
  column - put in place exlusion filters based on simple conditions on your product
  data - override product values - get product vision for a channel catalog scope
  - Analyze and optimize your performance of your catalogs on all yours channels with
  different type of reportings by day, channel, category and by product. - Automatize
  your optimisation by using rules! - And of course... Manage your orders harvested
  from all your marketplaces: - Synchronize your orders in an uniformized way - Get
  the available actions and update the order status - ...and more! ## Authentication
  credentials The public API with the base path **/v2/public** have been put in place
  to give you an entry point to our system for the user registration, login and lost
  password. The public API does not require any credentials. We give you the some
  public list of values and public channels for our public commercial web site [www.beezup.com](http://www.beezup.com).
  The user API with the base path **/v2/user** requires a token which is available
  on this page: https://go.beezup.com/Account/MyAccount ## Things to keep in mind
  ### API Rate Limits - The BeezUP REST API is limited to 100 calls/minute. ### Media
  type The default media type for requests and responses is application/json. Where
  noted, some operations support other content types. If no additional c'
