type: PlatformService
name: Bandsintown API (bandsintown.com)
description: '# What is the Bandsintown API? The Bandsintown API is designed for artists
  and enterprises representing artists. It offers read-only access to artist info
  and artist events: - artist info: returns the link to the Bandsintown artist page,
  the link to the artist photo, the current number of trackers and more - artist events:
  returns the list of events including their date and time, venue name and location,
  ticket links, lineup, description and the link to the Bandsintown event page Note
  you can specify if you only want to return upcoming events, past events, all events,
  or events within a given date range. # Getting Started - In order to use the Bandsintown
  API, you must read and accept our Terms and Conditions below and you must have written
  consent from Bandsintown Inc. Any other use of the Bandsintown API is prohibited.
  [Contact Bandsintown](http://help.bandsintown.com/) to tell us what you plan to
  do and request your personal application ID. - Find out about the API methods available
  and the format of the API responses below. Select the method you wish to use and
  try it out online with the app ID provided to you. - Call our Bandsintown API with
  the app ID provided straight from your website or back-end platform and choose which
  element of the API response you wish to display. Scroll to the bottom of this page
  to find out about the Models used.'
