  See [Update log](#section/Appendices/Update-log) # Overview The Viator Partner API
  comprises a set of endpoints that can support the operation of a fully-featured
  tours and experiences booking website or application; or, it can be integrated with
  your existing travel-booking software. The API exposes a variety of services that
  allow the retrieval of all product details, such as descriptions, pricing, terms
  and conditions, photos and reviews. This data can either be ingested periodically
  and managed on your local system, or calls can be made in real time to retrieve
  content in response to your users'' activity on your systems. The API allows product
  availability schedules to be retrieved in bulk or queried in real-time, and it can
  perform pricing calculations according to the number and type of traveler for the
  wide variety of product option combinations typically available in the tours and
  activities sales workflow. The API provides booking and post-booking functionality,
  allowing booking requests, ticket purchase, and booking status updates. Various
  utility services are available to map between yours and Viator''s data taxonomy.
  **Please note:** The API does not provide services for storing data, s'
