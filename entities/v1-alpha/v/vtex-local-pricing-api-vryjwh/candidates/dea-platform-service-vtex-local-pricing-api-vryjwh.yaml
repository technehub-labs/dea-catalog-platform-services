name: Pricing API (vtex.local:Pricing-API)
description: '> Check the new [Pricing onboarding guide](https://developers.vtex.com/vtex-rest-api/docs/pricing-overview).
  We created this guide to improve the onboarding experience for developers at VTEX.
  It assembles all documentation on our Developer Portal about Pricing and is organized
  by focusing on the developer''s journey. Pricing is the VTEX module responsible
  for the SKU''s price list. At this module we have the base price of each SKU, some
  optional fixed prices by trade policy, and some rules that can be applied to generate
  dynamically different final prices according to the purchase context and the trade
  policy. The variables used in this collection are: * **{{accountName}}** = You VTEX
  account name. * **{{tradePolicyId}}** = Current Trade Policy ID. * **{{itemId}}**
  = SKU ID. * **{{X-VTEX-API-AppKey}}** and **{{X-VTEX-API-AppToken}}** = Credentials.
  You can get more information about how to use this module and its business logic
  at [VTEX Help](http://help.vtex.com). ## Rate Limits ### Limits per route - `GET`:
  routes are not rate limited at the moment - `PUT or POST`: `40 requests/second/account`
  in any **price insert/update route** with 1000 *Burst Credits* - `DELETE`: `16 requests/second/account`
  in any **price deletion route**, with 300 *Burst Credits*. ### What are Burst Credits?
  In case the account exceeds the limit frequency for a `Rate Limiter` (for instance,
  when one account makes `41 requests/second` in any `price insert/update route`),
  we decrease from the *Burst Credit* count the exceeding (in this example, *1 Credit*).
  In the event of the *Burst Credits* reaching **0 (zero)**, the request is blocked
  with a `Status 429` response. The credits fill up over time when the route is not
  being used, in the same rate as the route''s `Rate Limiter`. In our example, for
  each second not sending a **PUT or POST request**, we increase *40 Burst Credits*
  to this `Rate Limiter` ### New Response Headers In the response headers of any request
  to Pricing v2 there are some new '
