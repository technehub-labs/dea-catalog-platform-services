type: PlatformService
name: Bill Payment Validator (mastercard.com:BillPay)
description: The Bill Payment Validator service allows RPPS origination (payment sender)
  customers to identify if a potential RPPS transaction would process successfully
  before transmitting the formal payment transaction, reducing RPPS payment rejects
  and costly payment processing exceptions.
