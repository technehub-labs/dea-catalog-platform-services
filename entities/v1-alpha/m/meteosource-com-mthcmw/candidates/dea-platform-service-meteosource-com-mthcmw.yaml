type: PlatformService
name: Interactive documentation for your Premium plan (meteosource.com)
description: This interactive documentation is using your API key which is filled
  in automatically, you can find and change this in [your dashboard](https://www.meteosource.com/client).
  Using the `GET` button, open your selected endpoint and read the introduction. You
  will find a detailed description of available parameters. You can complete the `Parameters`
  section and hit `Execute` to view a full API response. You can then inspect the
  JSON response, copy the `curl` command to run it on your machine, or obtain a URL
  of the request. In this way, you can easily build request command for the data you
  need.
