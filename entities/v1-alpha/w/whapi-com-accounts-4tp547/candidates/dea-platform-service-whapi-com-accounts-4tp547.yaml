name: Accounts API (whapi.com:accounts)
description: The Accounts API is a collection of methods used to query a customer
  account. It allows the developer to retrieve account-related data such as the user
  account balance. It should be noted that regional variations may exist - so some
  fields may not be returned for certain territories.
