name: Weatherbit - Interactive Swagger UI Documentation (weatherbit.io)
description: This an interactive version of the documentation for the Weatherbit API.
  The base URL for the API is [http://api.weatherbit.io/v2.0/](http://api.weatherbit.io/v2.0/)
  or [https://api.weatherbit.io/v2.0/](http://api.weatherbit.io/v2.0/). Below is the
  Swagger UI documentation for the API. All API requests require the `key` parameter.
  An Example for a 48 hour forecast for London, UK would be `http://api.weatherbit.io/v2.0/forecast/hourly?lat=51.5072`&`lon=-0.1276`.
  See our [Weather API description page](https://www.weatherbit.io/api) for the full
  documentation.
