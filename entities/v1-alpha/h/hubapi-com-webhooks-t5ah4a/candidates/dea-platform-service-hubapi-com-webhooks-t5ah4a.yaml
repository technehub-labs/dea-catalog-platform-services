id: dea:platform-service-hubapi-com-webhooks-t5ah4a
type: PlatformService
name: Webhooks API (hubapi.com:webhooks)
description: Provides a way for apps to subscribe to certain change events in HubSpot.
  Once configured, apps will receive event payloads containing details about the changes
  at a specified target URL. There can only be one target URL for receiving event
  notifications per app.
