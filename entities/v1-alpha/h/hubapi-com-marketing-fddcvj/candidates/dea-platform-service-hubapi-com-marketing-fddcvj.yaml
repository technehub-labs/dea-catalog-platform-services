type: PlatformService
name: Marketing Events Extension (hubapi.com:marketing)
description: 'These APIs allow you to interact with HubSpot''s Marketing Events Extension.
  It allows you to: * Create, Read or update Marketing Event information in HubSpot
  * Specify whether a HubSpot contact has registered, attended or cancelled a registration
  to a Marketing Event. * Specify a URL that can be called to get the details of a
  Marketing Event.'
