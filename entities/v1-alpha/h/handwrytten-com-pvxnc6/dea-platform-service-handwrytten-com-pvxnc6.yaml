name: Handwrytten API (handwrytten.com)
description: This is the Handwrytten API for sending cards written in the handwriting
  of your choice. Using this api, you can send cards to users. You can also customize
  cards with logos, which can be saved and then used like any other card in the system.
  For a "sandbox" account, please contact contact@handwrytten.com To move from credit
  card per-transaction to monthly invoicing, also contact us. [https://www.handwrytten.com](https://www.handwrytten.com)
