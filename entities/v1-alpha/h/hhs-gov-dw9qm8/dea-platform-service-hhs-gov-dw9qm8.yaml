id: dea:platform-service-hhs-gov-dw9qm8
type: PlatformService
name: HHS Media Services API (hhs.gov)
description: <div class="swagger-ui-wrap extraFooter"><h3>Common Features / Behaviors</h3>
  <div class="features"> <ul> <li><strong>* "sort" param:</strong> supports multi
  column sorting through the use of commas as delimiters, and a hyphen to denote descending
  order. <br/> <strong><span>Examples:</span></strong> <ul> <li><span class="example">name</span><span
  class="description">sort results by name ascending</span></li> <li><span class="example">-name</span><span
  class="description">sort results by name descending</span></li> <li><span class="example">-name,id</span><span
  class="description">sort results by name descending and then by id ascending</span></li>
  <li><span class="example">id,-dateContentAuthored</span><span class="description">sort
  results by id ascending and then date descending</span></li> </ul> </li> <li><strong>Date
  formats:</strong> Date input format is expected to be based on <a href="http://www.ietf.org/rfc/rfc3339.txt">RFC
  3339</a>. <br/> <span><strong>Example:</strong></span> <ul><li>2013-11-18T18:43:01Z</li></ul>
  </li> </ul> </div> </div>
