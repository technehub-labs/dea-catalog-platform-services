id: dea:platform-service-deutschebahn-com-flinkster-878gkg
type: PlatformService
name: Flinkster_API_NG (deutschebahn.com:flinkster)
description: 'This REST-API enables you to query for private transport sharing offers
  provided by companies and cities in Germany, Netherland and Austria. You can search
  for informations about the rental stations (points or areas) where you can find
  the rentals by utilizing the /areas/ ressource. With the help of the proximity search
  in the /bookingproposals/ URI you can request the availabilities of the rentalobjects
  for spontaneous or planed usage in the future. Feel free to browse through data
  by setting the parameter ''providernetwork'' to the value: 1: Search for car sharing
  offers provided by the Flinkster platform (http://www.flinkster.de) 2: Finding bike
  rental offers from Call a Bike (http://www.callabike.de) You can find more details
  in the documentation section (Unfortunately only available in german language).
  Have lots of fun and we are lucky to take notice of your products or getting your
  feedback.'
