id: dea:platform-service-digitalocean-com-d95vra
type: PlatformService
name: DigitalOcean API (digitalocean.com)
description: '# Introduction The DigitalOcean API allows you to manage Droplets and
  resources within the DigitalOcean cloud in a simple, programmatic way using conventional
  HTTP requests. All of the functionality that you are familiar with in the DigitalOcean
  control panel is also available through the API, allowing you to script the complex
  actions that your situation requires. The API documentation will start with a general
  overview about the design and technology that has been implemented, followed by
  reference information about specific endpoints. ## Requests Any tool that is fluent
  in HTTP can communicate with the API simply by requesting the correct URI. Requests
  should be made using the HTTPS protocol so that traffic is encrypted. The interface
  responds to different methods depending on the action required. |Method|Usage| |---
  |--- | |GET|For simple retrieval of information about your account, Droplets, or
  environment, you should use the GET method. The information you request will be
  returned to you as a JSON object. The attributes defined by the JSON object can
  be used to form additional requests. Any request using the GET method is read-only
  and will not affect any of the objects you are querying.| |DELETE|To destroy a resource
  and remove it from your account and environment, the DELETE method should be used.
  This will remove the specified object if it is found. If it is not found, the operation
  will return a response indicating that the object was not found. This idempotency
  means that you do not have to check for a resource''s availability prior to issuing
  a delete command, the final state will be the same regardless of its existence.|
  |PUT|To update the information about a resource in your account, the PUT method
  is available. Like the DELETE Method, the PUT method is idempotent. It sets the
  state of the target using the provided values, regardless of their current values.
  Requests using the PUT method do not need to check the current attributes of the
  object.| |PATCH'
