name: Docker Engine API (docker.com:engine)
description: 'The Engine API is an HTTP API served by Docker Engine. It is the API
  the Docker client uses to communicate with the Engine, so everything the Docker
  client can do can be done with the API. Most of the client''s commands map directly
  to API endpoints (e.g. `docker ps` is `GET /containers/json`). The notable exception
  is running containers, which consists of several API calls. # Errors The API uses
  standard HTTP status codes to indicate the success or failure of the API call. The
  body of the response will be JSON in the following format: ``` { "message": "page
  not found" } ``` # Versioning The API is usually changed in each release of Docker,
  so API calls are versioned to ensure that clients don''t break. For Docker Engine
  17.09, the API version is 1.32. To lock to this version, you prefix the URL with
  `/v1.32`. For example, calling `/info` is the same as calling `/v1.32/info`. Engine
  releases in the near future should support this version of the API, so your client
  will continue to work even if it is talking to a newer Engine. In previous versions
  of Docker, it was possible to access the API without providing a version. This behaviour
  is now deprecated will be removed in a future version of Docker. The API uses an
  open schema model, which means server may add extra properties to responses. Likewise,
  the server will ignore any extra query parameters and request body properties. When
  you write clients, you need to ignore additional properties in responses to ensure
  they do not break when talking to newer Docker daemons. This documentation is for
  version 1.33 of the API. Use this table to find documentation for previous versions
  of the API: Docker version | API version | Changes ----------------|-------------|---------
  17.09.x | [1.31](https://docs.docker.com/engine/api/v1.32/) | [API changes](https://docs.docker.com/engine/api/version-history/#v1-32-api-changes)
  17.07.x | [1.31](https://docs.docker.com/engine/api/v1.31/) | [API changes](https://docs.docker.com/engine/api'
