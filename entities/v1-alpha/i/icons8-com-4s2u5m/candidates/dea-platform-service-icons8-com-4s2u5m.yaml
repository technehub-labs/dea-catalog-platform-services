name: Use a [New Version](https://icons8.github.io/icons8-docs/) Instead (icons8.com)
description: '# Icons8 API Icons8 API allows us to search and obtain [our icons](https://icons8.com/web-app).
  You''re welcome to use our icons to extend the functionality of your web and mobile
  applications, website templates, and even tattoos. ![Tattoos](https://cdn.rawgit.com/icons8/api-docs/cff6fdf0/tattoos.svg)
  ## Usage Examples Some examples of what you can do with our icons: * **Template
  customization.** This way, [Canva](https://www.canva.com/) uses our icons to customize
  their layouts. * **Graphics and text editors.** [Gravit](https://gravit.io/) allows
  to insert our icons into the mockups. * **Any application with customization.**
  [TimeTune](http://timetune.center/) uses our icons to customize the activities.
  ## Getting Started To get started, please [contact us](https://icons8.com/contact)
  to obtain an API key. ## Pricing Our API license starts at $100/month.'
