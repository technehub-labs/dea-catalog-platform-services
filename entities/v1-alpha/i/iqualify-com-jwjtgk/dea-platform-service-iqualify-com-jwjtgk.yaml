name: iQualify Management API (iqualify.com)
description: 'The iQualify API offers management responses for building learning experiences
  using your iQualify instance data. Once you’ve registered with iQualify, you can
  request an API access token by navigating to the API access section of the "Account
  Settings" area. Find out how to [Request your API access token](https://www.iqualify.com/help/connecting-iqualify-to-other-systems/api/how-to-access-and-manage-your-api-token)
  on our Knowledge base. All endpoints are only accessible via https and are located
  at api.iqualify.com. For instance: you can find your current offerings by accessing
  the following URL: https://api.iqualify.com/v1/offerings/current'
