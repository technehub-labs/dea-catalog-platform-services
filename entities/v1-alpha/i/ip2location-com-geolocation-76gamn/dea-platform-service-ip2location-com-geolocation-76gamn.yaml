id: dea:platform-service-ip2location-com-geolocation-76gamn
type: PlatformService
name: IP2Location IP Geolocation (ip2location.com:geolocation)
description: IP2Location web service providing a service to do a reverse lookup of
  an IP address to an ISO3166 country code, region or state, city, latitude and longitude,
  ZIP/Postal code, time zone, Internet Service Provider (ISP) or company name, domain
  name, net speed, area code, weather station code, weather station name, mobile country
  code (MCC), mobile network code (MNC) and carrier brand, elevation, usage type,
  address type and IAB category. There are also 7 categories of additional add-on
  response fields supported such as metro, olson time zone, translations and more.
  Refer to https://www.ip2location.com/web-service/ip2location for further information.
