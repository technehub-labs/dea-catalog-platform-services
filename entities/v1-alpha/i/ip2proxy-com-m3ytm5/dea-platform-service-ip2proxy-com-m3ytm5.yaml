id: dea:platform-service-ip2proxy-com-m3ytm5
type: PlatformService
name: IP2Proxy Proxy Detection (ip2proxy.com)
description: IP2Proxy allows instant detection of anonymous proxy, VPN, TOR exit nodes,
  search engine robots (SES), data center ranges (PX2-PX10), residential proxies (PX10)
  and VPN provider name (PX11) by IP address. It also returns the threat type of the
  proxy (PX9 or higher). Visit https://www.ip2location.com/web-service/ip2proxy for
  further information.
