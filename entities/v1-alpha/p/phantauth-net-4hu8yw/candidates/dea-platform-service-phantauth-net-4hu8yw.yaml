description: 'Random User Generator + OpenID Connect Provider. Like Lorem Ipsum, but
  for user accounts and authentication. The PhantAuth API documentation is available
  on the following API documentation sites: - [apiary](https://phantauth.docs.apiary.io)
  (primary source) - [speca](https://speca.io/phantauth/phantauth) - [PhantAuth Developer
  Portal](https://www.phantauth.net/api) ### TL;DR **PhantAuth was designed to simplify
  testing for applications using OpenID Connect authentication by making use of random
  generated users.** endpoint | address --------- | ------- issuer | https://phantauth.net
  discovery | https://phantauth.net/.well-known/openid-configuration credential |
  value ------------- | ----- client_id | test.client client_secret | UTBcWwt5 ##
  OpenID Connect The OpenID Connect Provider of PhantAuth supports the flows listed
  in the OpenID Connect specifications (Hybrid, Implicit, Authorization Code), as
  well as the Resource Owner Password grant type, specified in the OAuth 2.0 specifications.
  PhantAuth as an OpenID Connect Provider can be integrated with a variety of web
  applications, mobil applications, and backend applications. The integration can
  be either direct, as in the case of the OpenID Connect Provider, or through an authentication
  integration service, as in the case of Auth0 or Azure Active Directory B2C. To learn
  more, please go to chapter [Integration](https://doc.phantauth.net/#/integration).
  Examples: - [Direct OpenID Connect integration](https://www.phantauth.net/test/oidc)
  - [Auth0 Social Connections integration](https://www.phantauth.net/test/auth0) -
  [Azure Active Directory B2C integration](https://www.phantauth.net/test/azure) ##
