name: Polling Places API (phila.gov:pollingplaces)
description: This data set contains the list of polling places. It can be organized
  by ward/division, accessibility rating, or type of building. This list is used to
  assign poll workers, send the machines and necessary accessibility materials, etc.
  **Endpoint:** http://api.phila.gov/polling-places/v1
