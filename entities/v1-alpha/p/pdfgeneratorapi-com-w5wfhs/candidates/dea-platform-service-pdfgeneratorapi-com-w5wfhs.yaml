id: dea:platform-service-pdfgeneratorapi-com-w5wfhs
type: PlatformService
name: PDF Generator API (pdfgeneratorapi.com)
description: '# Introduction PDF Generator API allows you easily generate transactional
  PDF documents and reduce the development and support costs by enabling your users
  to create and manage their document templates using a browser-based drag-and-drop
  document editor. The PDF Generator API features a web API architecture, allowing
  you to code in the language of your choice. This API supports the JSON media type,
  and uses UTF-8 character encoding. You can find our previous API documentation page
  with references to Simple and Signature authentication [here](https://docs.pdfgeneratorapi.com/legacy).
  ## Base URL The base URL for all the API endpoints is `https://us1.pdfgeneratorapi.com/api/v3`
  For example * `https://us1.pdfgeneratorapi.com/api/v3/templates` * `https://us1.pdfgeneratorapi.com/api/v3/workspaces`
  * `https://us1.pdfgeneratorapi.com/api/v3/templates/123123` ## Editor PDF Generator
  API comes with a powerful drag & drop editor that allows to create any kind of document
  templates, from barcode labels to invoices, quotes and reports. You can find tutorials
  and videos from our [Support Portal](https://support.pdfgeneratorapi.com). * [Component
  specification](https://support.pdfgeneratorapi.com/en/category/components-1ffseaj/)
  * [Expression Language documentation](https://support.pdfgeneratorapi.com/en/category/expression-language-q203pa/)
  * [Frequently asked questions and answers](https://support.pdfgeneratorapi.com/en/category/qanda-1ov519d/)
  ## Definitions ### Organization Organization is a group of workspaces owned by your
  account. ### Workspace Workspace contains templates. Each workspace has access to
  their own templates and organization default templates. ### Master Workspace Master
  Workspace is the main/default workspace of your Organization. The Master Workspace
  identifier is the email you signed up with. ### Default Template Default template
  is a template that is available for all workspaces by default. You can set the template
  access type under Page Setup. If templat'
