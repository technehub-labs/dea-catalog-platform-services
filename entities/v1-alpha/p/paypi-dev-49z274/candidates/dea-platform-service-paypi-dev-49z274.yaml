name: EmailVerify (paypi.dev)
description: 'OTP email verification API by PayPI. <br/><br/> EmailVerify provides
  a simple way to verify email addresses. We send emails ourselves taking the burden
  of setting up email systems and tracking codes. <br/><br/> To learn more about this
  API, check out [EmailVerify documentation](https://emailverify.paypi.dev/) <br/><br/>
  ## Authentication All requests to the EmailVerify API must be authenticated with
  an API Key. To get an API key, subscribe to the EmailVerify [here](https://app.paypi.dev/subscribe/c2VydmljZTo1OGQxZDNmMy05OWQ5LTQ3ZjYtOWJkNi02OWNkMTY1OGFmOWU=).
  \ Set your `Authorization` header to `Bearer YOUR-API-KEY`. ``` curl -H "Content-Type:
  application/json" \ -H "Authorization: Bearer YOUR-API-KEY" \ ... ```'
