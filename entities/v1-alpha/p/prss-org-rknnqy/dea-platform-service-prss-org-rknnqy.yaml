name: ContentDepot (prss.org)
description: 'ContentDepot hosts a range of API’s that allow clients to manage, discover,
  and obtain content. The API spans many parts of the ContentDepot functionality including
  MetaPub (a.k.a. metadata distribution) and content management. ## MetaPub MetaPub
  collects, normalizes and distributes publicly available program, episode, and piece
  metadata through the public radio system. Backed by ContentDepot and its data model,
  MetaPub allows producers to supply metadata through various methods: 1. MetaPub
  Agents that collect producer metadata by "crawling" existing public feeds (e.g.
  C24, BBC) or the producer''s production system (e.g. ATC, ME, TED Radio Hour). 2.
  Manually enter metadata in the ContentDepot Portal on each program and episode.
  3. Publish/push the metadata to the MetaPub upload API and execute an ingest job.
  MetaPub then distributes this data to stations through an electronic program guide
  (EPG model) for display on various listener devices such as smart phones, tablets,
  web streams, HD radios, RDBS enabled FM radios, and more. The EPG format is based
  on the RadioDNS specifications. ### RadioDNS The RadioDNS Service and Programme
  Information Specification ([ETSI TS 102 818 v3.4.1](https://www.etsi.org/deliver/etsi_ts/102800_102899/102818/03.04.01_60/ts_102818v030401p.pdf))
  defines three primary documents: Service Information, Program Information, and Group
  Information. These documents, along with the core RadioDNS Hybrid Lookup for Radio
  Services Specification ([ETSI TS 103 270 v1.4.1](https://www.etsi.org/deliver/etsi_ts/103200_103299/103270/01.04.01_60/ts_103270v010401p.pdf)),
  define a system where an end listener device can dynamically discover program metadata
  and fetch the metadata via Internet Protocol (IP) requests. MetaPub''s use of RadioDNS
  differs slightly in that MetaPub (a.k.a PRSS) acts as the "service provider" while
  the stations and related middleware act as the end devices. While this is not the
  primary use case of RadioDNS, the flexibility in the spec'
