description: This file describes the Yodlee Platform APIs using the swagger notation.
  You can use this swagger file to generate client side SDKs to the Yodlee Platform
  APIs for many different programming languages. Yodlee supports the Java SDK and
  it is available <a href="https://developer.yodlee.com/java-sdk-overview ">here</a>.
  You can generate a client SDK for Python, Java, JavaScript, PHP or other languages
  according to your development needs. For more details about the APIs, refer to <a
  href="https://developer.yodlee.com/docs/api/1.1/Overview">Yodlee API v1.1 - Overview</a>.
