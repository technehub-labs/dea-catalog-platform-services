name: Rebilly REST API (rebilly.com)
description: '# Introduction The Rebilly API is built on HTTP. Our API is RESTful.
  It has predictable resource URLs. It returns HTTP response codes to indicate errors.
  It also accepts and returns JSON in the HTTP body. You can use your favorite HTTP/REST
  library for your programming language to use Rebilly''s API, or you can use one
  of our SDKs (currently available in [PHP](https://github.com/Rebilly/rebilly-php)
  and [Javascript](https://github.com/Rebilly/rebilly-js-sdk)). We have other APIs
  that are also available. Every action from our [app](https://app.rebilly.com) is
  supported by an API which is documented and available for use so that you may automate
  any workflows necessary. This document contains the most commonly integrated resources.
  # Authentication When you sign up for an account, you are given your first secret
  API key. You can generate additional API keys, and delete API keys (as you may need
  to rotate your keys in the future). You authenticate to the Rebilly API by providing
  your secret key in the request header. Rebilly offers three forms of authentication:
  secret key, publishable key, JSON Web Tokens, and public signature key. - [Secret
  API key](#section/Authentication/SecretApiKey): used for requests made from the
  server side. Never share these keys. Keep them guarded and secure. - [Publishable
  API key](#section/Authentication/PublishableApiKey): used for requests from the
  client side. For now can only be used to create a [Payment Token](#operation/PostToken)
  and a [File token](#operation/PostFile). - [JWT](#section/Authentication/JWT): short
  lifetime tokens that can be assigned a specific expiration time. Never share your
  secret keys. Keep them guarded and secure. &lt;!-- ReDoc-Inject: &lt;security-definitions&gt;
  --&gt; # Errors Rebilly follow''s the error response format proposed in [RFC 7807](https://tools.ietf.org/html/rfc7807)
  also known as Problem Details for HTTP APIs. As with our normal API responses, your
