name: koomalooma Partner API (koomalooma.com)
description: This is the koomalooma Partner API. koomalooma is the first Loyalty BPaaS
  (Business Process as a Service) for mobile and web companies. With koomalooma merchants
  issue points for actions their customers / users make on your mobile or web store,
  for example a purchase or a referral. koomalooma takes care of all the rest, from
  signing up users, keeping track of points and delivering rewards in over 80 countries.
  koomalooma offers an easy to integrate API and web backend to configure loyalty
  campaigns and track performance. You can find more at http://support.koomalooma.com
