description: The Beta endpoints for the new Email Activity APIs - functionality is subject to change without
  notice. You may not have access to this Beta endpoint. Email Activity offers filtering and search by
  event type for two days worth of data. There is an optional add-on to store 60 days worth of data. This
  add-on also gives you access to the ability to download a CSV of the 60 days worth of email event data.
