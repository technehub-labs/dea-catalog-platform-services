name: Shorten.REST API Documentation (shorten.rest)
description: '## Introduction The Shorten.rest API allows you to programmatically create short URLs (an
  &apos;alias&apos;) for longer URL (a &apos;destination&apos;). Each alias you create can be used to
  redirect the end user (person clicking on the link) to one or more destination URLs A default destination
  is always set and specific destinations can be set to redirect the end user to preferred destinations
  based on the user&apos;s geographical location (country) and device Operating System. In order to use
  the Shorten.Rest URL Shortening API you can choose to bind your own branded domain, sub-domain or to
  use our default domain - Short.FYI ### Destination Matching When creating or editing a short URL (&apos;alias&apos;)
  you can choose to specify a destination for each country and OS ([Supported OSes list](#tag/OperatingSystems))
  combination. When a user clicks on the short link, Shorten.rest will examine the end user''s country
  (determined by User''s IP) and OS (User agent) and match the most suitable destination for each user.
  (*) If no destination is set for a specific request combination Shorten.rest will use the default destination
  that exists within each short URL (**) BRANDED DOMAINS: If the requested alias does not exist in our
  database - Shorten.rest will redirect the user to the default fallback you set within your dashboard
  under the ‘Alias Not Found Page Url’ value for a custom domain. (***) Operating System (OS) destinations
  are stronger than a country destination! For example - if you have a custom landing page that is targeting
  people in the USA and a second landing page that is hyper focused for people who use iOS devices - a
  person clicking on your link in the USA that is on an iPhone will be redirected to the iOS landing page,
  while all other devices will be redirected to the USA landing page. | OS | Country | Destination | |
  :------------: |:---------------:| -----| | iOS | | YourDestination.com/ios | | | US | YourDestination.com/usa
