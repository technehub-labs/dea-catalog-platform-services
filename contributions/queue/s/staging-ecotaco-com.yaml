name: api.ecota.co v2 (staging-ecotaco.com)
description: 'The API ecotaco allows you to connect, create an account, manage your credit cards and order
  rides. # Authentication Ecotaco API use a system of application key and authentification token. ## Application
  key : The application key is generated by Ecota.co and unique to an application. Before accessing EcoTa.co
  APIs, you need to register your application. Please supply the following information to dev@ecota.co:
  - Application name - Company (if appropriate) - Contact name, phone and address - Contact email - Is
  this a web application, a desktop application, or an application running on a device? - Short description
  of your application It **must** be passed on request : "accounts -> login", "accounts -> facebook login"
  and "accounts -> register" . ## Authentification token : The authentification token is retrieved at
  login or register of an user. It **must** be passed in request for authenticate action in Authorization
  HTTP header. Example : Authorization: Token token=e55887022c1aca4c86abcc49e85ceb8a0c855d2af4d9fac75c08040a583dcde4
  # Language On some of our resources, we filter the content displayed based on the Accept-Language header.
  If the language is not defined or if we don''t use the language defined in this header, we automatically
  use French as the default language. EcoTa.co currently support two languages: English, French. ("en"
  and "fr") # Encoding All requests and answers on EcoTa.co are in UTF-8.'
