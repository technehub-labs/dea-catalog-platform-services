name: Shotstack (shotstack.io)
description: 'Shotstack is a video, image and audio editing service that allows for the automated generation
  of videos, images and audio using JSON and a RESTful API. You arrange and configure an edit and POST
  it to the API which will render your media and provide a file location when complete. For more details
  visit [shotstack.io](https://shotstack.io) or checkout our [getting started](https://shotstack.gitbook.io/docs/guides/getting-started)
  documentation. There are two main API''s, one for editing and generating assets (Edit API) and one for
  managing hosted assets (Serve API). The Edit API base URL is: <b>https://api.shotstack.io/{version}</b>
  The Serve API base URL is: <b>https://api.shotstack.io/serve/{version}</b>'
