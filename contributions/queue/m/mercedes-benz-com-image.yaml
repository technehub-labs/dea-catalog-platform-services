name: Vehicle Image (mercedes-benz.com:image)
description: The vehicle images API offers access to original Mercedes-Benz vehicle images. It provides
  access to exterior and interior images with parameters e.g. to modify the perspective and to display
  vehicles at day/nighttime. In addition you can request component images of a vehicle's engine, paint,
  rim, trim, upholstery and equipments.
