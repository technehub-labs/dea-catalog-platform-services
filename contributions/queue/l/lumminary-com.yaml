name: Lumminary API (lumminary.com)
description: '# Introduction The Lumminary API was built to allow third parties to
  interact with Lumminary customers and gain access to their genetic data. The Lumminary
  API is fast, scalable and highly secure. All requests to the Lumminary API take
  place over SSL, which means all communication of Customer data is encrypted. Before
  we dive in, some definitions. This is what we mean by: |Term|Definition| |-----------|-----------|
  |**Third party**|A third party (also referred to as "partner" or as "you") is a
  company which offers services and products using genetic data.| |**Lumminary clients**|The
  Lumminary client (also referred to as "customer") is an individual who has created
  an account on the Lumminary platform.| |**Lumminary**|This is us - our services
  including the Lumminary platform, the API, the DNA App Store, the DNA Vault, the
  "Connect with Lumminary" button, and the website in its totality. | |**CWL**|This
  is the acronym for the "Connect with Lumminary" button.| |**dataset**|This is the
  term we use when we refer to a customer''s genetic data.| |**Lumminary API**|This
  is a library/module that you can use to integrate your apps with the Lumminary platform.|
  |**Lumminary toolkit**|This is a stand alone application which helps you integrate
  with Lumminary without writing any code or interacting with the Lumminary API.|
  Let''s dive in, now. * [**Overview**](#section/Introduction/Overview) * [**Install
  Lumminary API Client and Toolkit**](#Install-Lumminary-API-Client-andor-Toolkit)
  * [**Obtaining credentials**](#Obtaining-credentials) * [**Query customers authorizations**](#Query-customers-authorizations)
  * [**Query customer genetic data**](#Query-customer-genetic-data) * [**Submit reports**](#Submit-reports)
  * [**"Connect with Lumminary" button**](#the-connect-with-lumminary-button) * [**API
  specs**](#tag/Lumminary) ## Overview In order to use Lumminary services, you''ll
  need to install the Lumminary API Client or Toolkit. The Lumminary API Client and
