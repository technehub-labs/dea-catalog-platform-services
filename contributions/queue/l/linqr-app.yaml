name: LinQR (linqr.app)
description: This is LinQR QR Code API documentation. This API allows you to generate custom, visually
  attractive QR Codes. The cloud infrastructure guarantees high availability and autoscalability of the
  service. You can generate hundreds of thousands of images this way and use them however you like. We
  realize that your API use case may require custom solutions, and perhaps we lack functionality that
  is very important to you. In that case feel free to write an email to our support and tell us about
  it. We have repeatedly added new functions of our service directly after the requests of our users.
  **General remarks:** - maximum request size is fixed at 32MB. - request timeout is fixed at 180 seconds.
