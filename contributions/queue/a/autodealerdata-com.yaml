name: CIS Automotive API (autodealerdata.com)
description: '<div style="">This API provides access to our Automotive Data. Use of this API is subject
  to our <a href="https://autodealerdata.com/tos">Terms of Service</a></div> &nbsp; <h3 style="">For a
  quick start guide <a href="/APIQuickStart">click here</a></h3> &nbsp; <div> If you signed up through
  RapidAPI make your test calls <a href="https://rapidapi.com/competitive-intelligence-solutions-llc-competitive-intelligence-solutions-llc-default/api/cis-automotive">here</a></div>
  &nbsp; <div>The general workflow is to: <br/>&nbsp;<div><strong>1.</strong> Authenticate with your CIS
  Automotive API Keys to get a Json Web Token (JWT). Do not use RapidAPI keys.</div> <div><div><strong>2.</strong>
  Then use that token as an argument when calling other endpoints.</div> &nbsp; <div>Equivalent HTTP GET
  and POST methods are available for some endpoints. </div> &nbsp; <div>Endpoints may appear more than
  once on this page if they are associated with multiple tags. eg "Sales Data", "Premium", "Pro Plan or
  Greater" To see which endpoints are included in different plans look under the "X Plan or Greater" tags
  for the respective plan name.</div> &nbsp; <h3>If you signed up for our API through RapidAPI you can
  make your test calls <a href="https://rapidapi.com/competitive-intelligence-solutions-llc-competitive-intelligence-solutions-llc-default/api/cis-automotive">on
  their platform</a>. Your RapidAPI credentials will not work on this page.</h3><h3> Do not use your RapidAPI
  keys on this page.</h3> <h3>If you signed up with us and have an account, you must first authenticate
  with your API Keys and retrieve a Json Web Token (JWT) from the /getToken endpoint to access the other
  endpoints.</h3> <h3>Your JWT is a required argument to all endpoints.</h3></div>'
