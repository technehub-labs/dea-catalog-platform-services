name: Adafruit IO REST API (adafruit.com)
description: '### The Internet of Things for Everyone The Adafruit IO HTTP API provides access to your
  Adafruit IO data from any programming language or hardware environment that can speak HTTP. The easiest
  way to get started is with [an Adafruit IO learn guide](https://learn.adafruit.com/series/adafruit-io-basics)
  and [a simple Internet of Things capable device like the Feather Huzzah](https://www.adafruit.com/product/2821).
  This API documentation is hosted on GitHub Pages and is available at [https://github.com/adafruit/io-api](https://github.com/adafruit/io-api).
  For questions or comments visit the [Adafruit IO Forums](https://forums.adafruit.com/viewforum.php?f=56)
  or the [adafruit-io channel on the Adafruit Discord server](https://discord.gg/adafruit). #### Authentication
  Authentication for every API request happens through the `X-AIO-Key` header or query parameter and your
  IO API key. A simple cURL request to get all available feeds for a user with the username "io_username"
  and the key "io_key_12345" could look like this: $ curl -H "X-AIO-Key: io_key_12345" https://io.adafruit.com/api/v2/io_username/feeds
  Or like this: $ curl "https://io.adafruit.com/api/v2/io_username/feeds?X-AIO-Key=io_key_12345 Using
  the node.js [request](https://github.com/request/request) library, IO HTTP requests are as easy as:
  ```js var request = require(''request''); var options = { url: ''https://io.adafruit.com/api/v2/io_username/feeds'',
  headers: { ''X-AIO-Key'': ''io_key_12345'', ''Content-Type'': ''application/json'' } }; function callback(error,
  response, body) { if (!error && response.statusCode == 200) { var feeds = JSON.parse(body); console.log(feeds.length
  + " FEEDS AVAILABLE"); feeds.forEach(function (feed) { console.log(feed.name, feed.key); }) } } request(options,
  callback); ``` Using the ESP8266 Arduino HTTPClient library, an HTTPS GET request would look like this
  (replacing `---` with your own values in the appropriate locations): ```arduino /// based on /// https://github.com/esp8266/Arduino/b'
