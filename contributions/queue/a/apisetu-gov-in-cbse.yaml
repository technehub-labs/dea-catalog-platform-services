description: CBSE (http://www.cbse.nic.in/) is issuing marksheets, passing certificates, migration certificates
  etc. through DigiLocker. These are either pushed, or can be pulled by students into their DigiLocker
  accounts. Currently available - 2004 - 2020 [Class XII], 2004 - 2020 [Class X], 2017 (NEET Rank Letter
  & Marksheet), 2016 (NEET Rank Letter), 2018 December (CTET Eligibility Certificate & Marksheet).
