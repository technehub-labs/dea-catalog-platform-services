name: Amazon SageMaker Feature Store Runtime (amazonaws.com:sagemaker-featurestore-runtime)
description: <p>Contains all data plane API operations and data types for the Amazon
  SageMaker Feature Store. Use this API to put, delete, and retrieve (get) features
  from a feature store.</p> <p>Use the following operations to configure your <code>OnlineStore</code>
  and <code>OfflineStore</code> features, and to create and manage feature groups:</p>
  <ul> <li> <p> <a href="https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_CreateFeatureGroup.html">CreateFeatureGroup</a>
  </p> </li> <li> <p> <a href="https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_DeleteFeatureGroup.html">DeleteFeatureGroup</a>
  </p> </li> <li> <p> <a href="https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_DescribeFeatureGroup.html">DescribeFeatureGroup</a>
  </p> </li> <li> <p> <a href="https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_ListFeatureGroups.html">ListFeatureGroups</a>
  </p> </li> </ul>
