name: AWS Server Migration Service (amazonaws.com:sms)
description: <important> <p> <b>Product update</b> </p> <p>We recommend <a href="http://aws.amazon.com/application-migration-service">Amazon
  Web Services Application Migration Service</a> (Amazon Web Services MGN) as the
  primary migration service for lift-and-shift migrations. If Amazon Web Services
  MGN is unavailable in a specific Amazon Web Services Region, you can use the Server
  Migration Service APIs through March 2023.</p> </important> <p>Server Migration
  Service (Server Migration Service) makes it easier and faster for you to migrate
  your on-premises workloads to Amazon Web Services. To learn more about Server Migration
  Service, see the following resources:</p> <ul> <li> <p> <a href="http://aws.amazon.com/server-migration-service/">Server
  Migration Service product page</a> </p> </li> <li> <p> <a href="https://docs.aws.amazon.com/server-migration-service/latest/userguide/">Server
  Migration Service User Guide</a> </p> </li> </ul>
