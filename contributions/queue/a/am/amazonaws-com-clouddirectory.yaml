  the Cloud Directory operations that you can call programmatically and includes detailed
  information on data types and errors. For information about Cloud Directory features,
  see <a href="https://aws.amazon.com/directoryservice/">AWS Directory Service</a>
  and the <a href="https://docs.aws.amazon.com/clouddirectory/latest/developerguide/what_is_cloud_directory.html">Amazon
  Cloud Directory Developer Guide</a>.</p>
