name: Amazon Interactive Video Service (amazonaws.com:ivs)
description: '<p> <b>Introduction</b> </p> <p>The Amazon Interactive Video Service
  (IVS) API is REST compatible, using a standard HTTP API and an Amazon Web Services
  EventBridge event stream for responses. JSON is used for both requests and responses,
  including errors.</p> <p>The API is an Amazon Web Services regional service. For
  a list of supported regions and Amazon IVS HTTPS service endpoints, see the <a href="https://docs.aws.amazon.com/general/latest/gr/ivs.html">Amazon
  IVS page</a> in the <i>Amazon Web Services General Reference</i>.</p> <p> <i> <b>All
  API request parameters and URLs are case sensitive. </b> </i> </p> <p>For a summary
  of notable documentation changes in each release, see <a href="https://docs.aws.amazon.com/ivs/latest/userguide/doc-history.html">
  Document History</a>.</p> <p> <b>Allowed Header Values</b> </p> <ul> <li> <p> <code>
  <b>Accept:</b> </code> application/json</p> </li> <li> <p> <code> <b>Accept-Encoding:</b>
  </code> gzip, deflate</p> </li> <li> <p> <code> <b>Content-Type:</b> </code>application/json</p>
  </li> </ul> <p> <b>Resources</b> </p> <p>The following resources contain information
  about your IVS live stream (see <a href="https://docs.aws.amazon.com/ivs/latest/userguide/getting-started.html">
  Getting Started with Amazon IVS</a>):</p> <ul> <li> <p> <b>Channel</b> — Stores
  configuration data related to your live stream. You first create a channel and then
  use the channel’s stream key to start your live stream. See the Channel endpoints
  for more information. </p> </li> <li> <p> <b>Stream key</b> — An identifier assigned
  by Amazon IVS when you create a channel, which is then used to authorize streaming.
  See the StreamKey endpoints for more information. <i> <b>Treat the stream key like
  a secret, since it allows anyone to stream to the channel.</b> </i> </p> </li> <li>
  <p> <b>Playback key pair</b> — Video playback may be restricted using playback-authorization
  tokens, which use public-key encryption. A playback key pair is the public-private
  pair '
