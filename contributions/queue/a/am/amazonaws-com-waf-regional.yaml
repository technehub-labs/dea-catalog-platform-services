description: <note> <p>This is <b>AWS WAF Classic Regional</b> documentation. For
  more information, see <a href="https://docs.aws.amazon.com/waf/latest/developerguide/classic-waf-chapter.html">AWS
  WAF Classic</a> in the developer guide.</p> <p> <b>For the latest version of AWS
  WAF</b>, use the AWS WAFV2 API and see the <a href="https://docs.aws.amazon.com/waf/latest/developerguide/waf-chapter.html">AWS
  WAF Developer Guide</a>. With the latest version, AWS WAF has a single set of endpoints
  for regional and global use. </p> </note> <p>This is the <i>AWS WAF Regional Classic
  API Reference</i> for using AWS WAF Classic with the AWS resources, Elastic Load
  Balancing (ELB) Application Load Balancers and API Gateway APIs. The AWS WAF Classic
  actions and data types listed in the reference are available for protecting Elastic
  Load Balancing (ELB) Application Load Balancers and API Gateway APIs. You can use
  these actions and data types by means of the endpoints listed in <a href="https://docs.aws.amazon.com/general/latest/gr/rande.html#waf_region">AWS
  Regions and Endpoints</a>. This guide is for developers who need detailed information
  about the AWS WAF Classic API actions, data types, and errors. For detailed information
  about AWS WAF Classic features and an overview of how to use the AWS WAF Classic
  API, see the <a href="https://docs.aws.amazon.com/waf/latest/developerguide/classic-waf-chapter.html">AWS
  WAF Classic</a> in the developer guide.</p>
