description: <fullname>AWS CodePipeline</fullname> <p> <b>Overview</b> </p> <p>This
  is the AWS CodePipeline API Reference. This guide provides descriptions of the actions
  and data types for AWS CodePipeline. Some functionality for your pipeline can only
  be configured through the API. For more information, see the <a href="https://docs.aws.amazon.com/codepipeline/latest/userguide/welcome.html">AWS
  CodePipeline User Guide</a>.</p> <p>You can use the AWS CodePipeline API to work
  with pipelines, stages, actions, and transitions.</p> <p> <i>Pipelines</i> are models
  of automated release processes. Each pipeline is uniquely named, and consists of
  stages, actions, and transitions. </p> <p>You can work with pipelines by calling:</p>
  <ul> <li> <p> <a>CreatePipeline</a>, which creates a uniquely named pipeline.</p>
  </li> <li> <p> <a>DeletePipeline</a>, which deletes the specified pipeline.</p>
  </li> <li> <p> <a>GetPipeline</a>, which returns information about the pipeline
  structure and pipeline metadata, including the pipeline Amazon Resource Name (ARN).</p>
  </li> <li> <p> <a>GetPipelineExecution</a>, which returns information about a specific
  execution of a pipeline.</p> </li> <li> <p> <a>GetPipelineState</a>, which returns
  information about the current state of the stages and actions of a pipeline.</p>
  </li> <li> <p> <a>ListActionExecutions</a>, which returns action-level details for
  past executions. The details include full stage and action-level details, including
  individual action duration, status, any errors that occurred during the execution,
  and input and output artifact location details.</p> </li> <li> <p> <a>ListPipelines</a>,
  which gets a summary of all of the pipelines associated with your account.</p> </li>
  <li> <p> <a>ListPipelineExecutions</a>, which gets a summary of the most recent
  executions for a pipeline.</p> </li> <li> <p> <a>StartPipelineExecution</a>, which
  runs the most recent revision of an artifact through the pipeline.</p> </li> <li>
