description: <p>This reference provides descriptions of the AWS Application Cost Profiler
  API.</p> <p>The AWS Application Cost Profiler API provides programmatic access to
  view, create, update, and delete application cost report definitions, as well as
  to import your usage data into the Application Cost Profiler service.</p> <p>For
  more information about using this service, see the <a href="https://docs.aws.amazon.com/application-cost-profiler/latest/userguide/introduction.html">AWS
  Application Cost Profiler User Guide</a>.</p>
