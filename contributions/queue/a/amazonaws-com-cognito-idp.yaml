description: <p>Using the Amazon Cognito user pools API, you can create a user pool to manage directories
  and users. You can authenticate a user to obtain tokens related to user identity and access policies.</p>
  <p>This API reference provides information about user pools in Amazon Cognito user pools.</p> <p>For
  more information, see the <a href="https://docs.aws.amazon.com/cognito/latest/developerguide/what-is-amazon-cognito.html">Amazon
  Cognito Documentation</a>.</p>
