name: Amazon AppIntegrations Service (amazonaws.com:appintegrations)
description: <p>The Amazon AppIntegrations service enables you to configure and reuse connections to external
  applications.</p> <p>For information about how you can use external applications with Amazon Connect,
  see <a href="https://docs.aws.amazon.com/connect/latest/adminguide/crm.html">Set up pre-built integrations</a>
  and <a href="https://docs.aws.amazon.com/connect/latest/adminguide/amazon-connect-wisdom.html">Deliver
  information to agents using Amazon Connect Wisdom</a> in the <i>Amazon Connect Administrator Guide</i>.</p>
