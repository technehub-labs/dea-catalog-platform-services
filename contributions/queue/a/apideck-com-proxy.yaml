name: Proxy API (apideck.com:proxy)
description: 'Welcome to the Proxy API. You can use this API to access all Proxy API endpoints. ## Base
  URL The base URL for all API requests is `https://unify.apideck.com` ## Headers Custom headers that
  are expected as part of the request. Note that [RFC7230](https://tools.ietf.org/html/rfc7230) states
  header names are case insensitive. | Name | Type | Required | Description | | ----------------------------------
  | ------ | -------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
  | | Authorization | String | Yes | Bearer API KEY | | x-apideck-app-id | String | Yes | The application
  id of your Unify application. Available at https://app.apideck.com/unify/api-keys. | | x-apideck-consumer-id
  | String | Yes | The id of the customer stored inside Apideck Vault. This can be a user id, account
  id, device id or whatever entity that can have integration within your app. | | x-apideck-downstream-url
  | String | Yes | Downstream URL to forward the request too | | x-apideck-downstream-authorization |
  String | No | Downstream authorization header. This will skip the Vault token injection. | | x-apideck-downstream-method
  | String | No | Downstream method. If not provided the upstream method will be inherited, depending
  on the verb/method of the request this will contain the request body you want to POST/PATCH/PUT. | |
  x-apideck-service-id | String | No | Describe the service you want to call (e.g., pipedrive). Only needed
  when a customer has activated multiple integrations for the same Unified API. | ## Authorization You
  can interact with the API through the authorization methods below. ### apiKey To use API you have to
  sign up and get your own API key. Unify API accounts have sandbox mode and live mode API keys. To change
  modes just use the appropriate key to get a live or test object. You can find your API keys on the unify
  settings of your Apideck app. Your '
