name: AppVeyor REST API (appveyor.com)
description: 'AppVeyor is a hosted continuous integration service which runs on Microsoft
  Windows. The AppVeyor REST API provides a RESTful way to interact with the AppVeyor
  service. This includes managing projects, builds, deployments, and the teams that
  build them. Additional help and discussion of the AppVeyor REST API is available
  at http://help.appveyor.com/discussions This Swagger definition is an **unofficial**
  description of the AppVeyor REST API maintained at https://github.com/kevinoid/appveyor-swagger
  Please report any issues or suggestions for this Swagger definition at https://github.com/kevinoid/appveyor-swagger/issues/new
  #### API Conventions Fields which are missing from update operations (`PUT` requests)
  are typically reset to their default values. So although most fields are not technically
  required, they should usually be specified in practice.'
