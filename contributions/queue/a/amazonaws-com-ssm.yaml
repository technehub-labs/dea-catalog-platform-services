name: Amazon Simple Systems Manager (SSM) (amazonaws.com:ssm)
description: <p>Amazon Web Services Systems Manager is the operations hub for your Amazon Web Services
  applications and resources and a secure end-to-end management solution for hybrid cloud environments
  that enables safe and secure operations at scale.</p> <p>This reference is intended to be used with
  the <a href="https://docs.aws.amazon.com/systems-manager/latest/userguide/">Amazon Web Services Systems
  Manager User Guide</a>. To get started, see <a href="https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-setting-up.html">Setting
  up Amazon Web Services Systems Manager</a>.</p> <p class="title"> <b>Related resources</b> </p> <ul>
  <li> <p>For information about each of the capabilities that comprise Systems Manager, see <a href="https://docs.aws.amazon.com/systems-manager-automation-runbooks/latest/userguide/what-is-systems-manager.html#systems-manager-capabilities">Systems
  Manager capabilities</a> in the <i>Amazon Web Services Systems Manager User Guide</i>.</p> </li> <li>
  <p>For details about predefined runbooks for Automation, a capability of Amazon Web Services Systems
  Manager, see the <i> <a href="https://docs.aws.amazon.com/systems-manager-automation-runbooks/latest/userguide/automation-runbook-reference.html">Systems
  Manager Automation runbook reference</a> </i>.</p> </li> <li> <p>For information about AppConfig, a
  capability of Systems Manager, see the <i> <a href="https://docs.aws.amazon.com/appconfig/latest/userguide/">AppConfig
  User Guide</a> </i> and the <i> <a href="https://docs.aws.amazon.com/appconfig/2019-10-09/APIReference/">AppConfig
  API Reference</a> </i>.</p> </li> <li> <p>For information about Incident Manager, a capability of Systems
  Manager, see the <i> <a href="https://docs.aws.amazon.com/incident-manager/latest/userguide/">Systems
  Manager Incident Manager User Guide</a> </i> and the <i> <a href="https://docs.aws.amazon.com/incident-manager/latest/APIReference/">Systems
  Manager Incident Manager API Reference</a> </i>.</p> </li> </u
