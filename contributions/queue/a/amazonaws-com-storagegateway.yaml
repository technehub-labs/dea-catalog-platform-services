name: AWS Storage Gateway (amazonaws.com:storagegateway)
description: '<fullname>Storage Gateway Service</fullname> <p>Storage Gateway is the service that connects
  an on-premises software appliance with cloud-based storage to provide seamless and secure integration
  between an organization''s on-premises IT environment and the Amazon Web Services storage infrastructure.
  The service enables you to securely upload data to the Amazon Web Services Cloud for cost effective
  backup and rapid disaster recovery.</p> <p>Use the following links to get started using the <i>Storage
  Gateway Service API Reference</i>:</p> <ul> <li> <p> <a href="https://docs.aws.amazon.com/storagegateway/latest/userguide/AWSStorageGatewayAPI.html#AWSStorageGatewayHTTPRequestsHeaders">Storage
  Gateway required request headers</a>: Describes the required headers that you must send with every POST
  request to Storage Gateway.</p> </li> <li> <p> <a href="https://docs.aws.amazon.com/storagegateway/latest/userguide/AWSStorageGatewayAPI.html#AWSStorageGatewaySigningRequests">Signing
  requests</a>: Storage Gateway requires that you authenticate every request you send; this topic describes
  how sign such a request.</p> </li> <li> <p> <a href="https://docs.aws.amazon.com/storagegateway/latest/userguide/AWSStorageGatewayAPI.html#APIErrorResponses">Error
  responses</a>: Provides reference information about Storage Gateway errors.</p> </li> <li> <p> <a href="https://docs.aws.amazon.com/storagegateway/latest/APIReference/API_Operations.html">Operations
  in Storage Gateway</a>: Contains detailed descriptions of all Storage Gateway operations, their request
  parameters, response elements, possible errors, and examples of requests and responses.</p> </li> <li>
  <p> <a href="https://docs.aws.amazon.com/general/latest/gr/sg.html">Storage Gateway endpoints and quotas</a>:
  Provides a list of each Amazon Web Services Region and the endpoints available for use with Storage
  Gateway.</p> </li> </ul> <note> <p>Storage Gateway resource IDs are in uppercase. When you use these
  resource IDs with the Amazon'
