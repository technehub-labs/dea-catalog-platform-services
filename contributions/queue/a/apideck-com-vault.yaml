name: Vault API (apideck.com:vault)
description: 'Welcome to the Vault API 👋 When you''re looking to connect to an API,
  the first step is authentication. Vault helps you handle OAuth flows, store API
  keys, and refresh access tokens from users (called consumers in Apideck). ## Base
  URL The base URL for all API requests is `https://unify.apideck.com` ## Get Started
  To use the Apideck APIs, you need to sign up for free at [https://app.apideck.com/signup]().
  Follow the steps below to get started. - [Create a free account.](https://app.apideck.com/signup)
  - Go to the [Dashboard](https://app.apideck.com/unify/unified-apis/dashboard). -
  Get your API key and the application ID. - Select and configure the integrations
  you want to make available to your users. Through the Unify dashboard, you can configure
  which connectors you want to support as integrations. - Retrieve the client_id and
  client_secret for the integration you want to activate (Only needed for OAuth integrations).
  - Soon, you can skip the previous step and use the Apideck sandbox credentials to
  get you started instead (upcoming) - Register the redirect URI for the example app
  (https://unify.apideck.com/vault/callback) in the list of redirect URIs under your
  app''s settings - Use the [publishing guides](/app-listing-requirements) to get
  your integration listed across app marketplaces. ### Hosted Vault Hosted Vault (vault.apideck.com)
  is a no-code solution, so you don''t need to build your own UI to handle the integration
  settings and authentication. ![Hosted Vault - Integrations portal](https://github.com/apideck-samples/integration-settings/raw/master/public/img/vault.png)
  Behind the scenes, Hosted Vault implements the Vault API endpoints and handles the
  following features for your customers: - Add a connection - Handle the OAuth flow
  - Configure connection settings per integration - Manage connections - Discover
  and propose integration options - Search for integrations (upcoming) - Give integration
  suggestions based on provided metadata (email or website) when c'
