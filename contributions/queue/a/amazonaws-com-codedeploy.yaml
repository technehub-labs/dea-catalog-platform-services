name: AWS CodeDeploy (amazonaws.com:codedeploy)
description: '<p>CodeDeploy is a deployment service that automates application deployments to Amazon EC2
  instances, on-premises instances running in your own facility, serverless Lambda functions, or applications
  in an Amazon ECS service.</p> <p>You can deploy a nearly unlimited variety of application content, such
  as an updated Lambda function, updated applications in an Amazon ECS service, code, web and configuration
  files, executables, packages, scripts, multimedia files, and so on. CodeDeploy can deploy application
  content stored in Amazon S3 buckets, GitHub repositories, or Bitbucket repositories. You do not need
  to make changes to your existing code before you can use CodeDeploy.</p> <p>CodeDeploy makes it easier
  for you to rapidly release new features, helps you avoid downtime during application deployment, and
  handles the complexity of updating your applications, without many of the risks associated with error-prone
  manual deployments.</p> <p> <b>CodeDeploy Components</b> </p> <p>Use the information in this guide to
  help you work with the following CodeDeploy components:</p> <ul> <li> <p> <b>Application</b>: A name
  that uniquely identifies the application you want to deploy. CodeDeploy uses this name, which functions
  as a container, to ensure the correct combination of revision, deployment configuration, and deployment
  group are referenced during a deployment.</p> </li> <li> <p> <b>Deployment group</b>: A set of individual
  instances, CodeDeploy Lambda deployment configuration settings, or an Amazon ECS service and network
  details. A Lambda deployment group specifies how to route traffic to a new version of a Lambda function.
  An Amazon ECS deployment group specifies the service created in Amazon ECS to deploy, a load balancer,
  and a listener to reroute production traffic to an updated containerized application. An Amazon EC2/On-premises
  deployment group contains individually tagged instances, Amazon EC2 instances in Amazon EC2 Auto Scaling
  groups, or both. All deployment g'
