name: AWS Security Token Service (amazonaws.com:sts)
description: <fullname>Security Token Service</fullname> <p>Security Token Service
  (STS) enables you to request temporary, limited-privilege credentials for Identity
  and Access Management (IAM) users or for users that you authenticate (federated
  users). This guide provides descriptions of the STS API. For more information about
  using this service, see <a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_temp.html">Temporary
  Security Credentials</a>.</p>
