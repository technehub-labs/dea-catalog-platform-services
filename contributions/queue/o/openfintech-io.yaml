name: OpenFinTech.io (openfintech.io)
description: '# Introduction [OpenFinTech.io](https://openfintech.io) is an open database
  that comprises of standardized primary data for FinTech industry.<br> It contains
  such information as geolocation data (countries, cities, regions), organizations,
  currencies (national, digital, virtual, crypto), banks, digital exchangers, payment
  providers (PSP), payment methods, etc.<br> It is created for communication of cross-integrated
  micro-services on "one language". This is achieved through standardization of entity
  identifiers that are used to exchange information among different services.<br>
  ### UML UML Domain Model diagram you can find [here](https://api.openfintech.io/public_domain_model.png).<br>
  ### Persistence Entities are updated not more than 1 time per day.<br> ### Terms
  and Conditions This *OpenFinTech.io* is made available under the [Open Database
  License](http://opendatacommons.org/licenses/odbl/1.0/).<br> Any rights in individual
  contents of the database are licensed under the [Database Contents License](http://opendatacommons.org/licenses/dbcl/1.0/).<br>
  ### Contacts For any questions, please email - info@openfintech.io<br> Or you can
  contact us at <a href="https://gitter.im/paymaxicom/openfintech.io">Gitter</a><br>
  Powered by [Paymaxi](https://www.paymaxi.com) # Get Started If you use [POSTMAN](https://www.getpostman.com)
  or similar program which can operate with swagger`s files - just [download](https://docs.openfintech.io)
  our spec and [import it](https://www.getpostman.com/docs/importing_swagger). Also
  you can try live [API demo](https://api.openfintech.io). ## Overview The OpenFinTech
  API is organized around [REST](https://en.wikipedia.org/wiki/Representational_state_transfer).
  Our API has predictable, resource-oriented URLs, and uses HTTP response codes to
  indicate API errors.<br> API is based on [JSON API](http://jsonapi.org) standard.
  JSON is returned by all API responses, including errors, although our API libraries
  convert responses to appropriate language-s'
