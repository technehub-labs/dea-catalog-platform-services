  class=''openapi-button'' _ngcontent-c6>View Postman docs</a> # Quickstart Visit
  [github](https://github.com/EmitKnowledge/Envoice) to view the quickstart tutorial.
  <div class=''postman-tutorial''> # Tutorial for running the API in postman Click
  on ""Run in Postman"" button <br /><br /> ![postman - tutorial - 1](/Assets/images/api/postman-tutorial/postman-tutorial-1.png)
  --- A new page will open. Click the ""Postman for windows"" to run postman as a
  desktop app. Make sure you have already [installed](https://www.getpostman.com/docs/postman/launching_postman/installation_and_updates)
  Postman. <br /><br /> ![postman - tutorial - 2](/Assets/images/api/postman-tutorial/postman-tutorial-2.png)
  --- In chrome an alert might show up to set a default app for opening postman links.
  Click on ""Open Postman"". <br /><br /> ![postman - tutorial - 3](/Assets/images/api/postman-tutorial/postman-tutorial-3.png)
  --- The OpenAPI specification will be imported in Postman as a new collection named
  ""Envoice api"" <br /><br /> ![postman - tutorial - 4](/Assets/images/api/postman-tutorial/postman-tutorial-4.png)
  --- When testing be sure to check and modify the environment variables to suit your
  api key and secret. The domain is set to envoice''s endpoint so you don''t really
  need to change that. <sub>\*Eye button in top right corner </sub> <br /><br /> ![postman
  - tutorial - 5](/Assets/images/api/postman-tutorial/postman-tutorial-5.png) <br
  /><br /> ![postman - tutorial - 6](/Assets/images/api/postman-tutorial/postman-tutorial-6.png)
  --- You don''t need to change the values of the header parameters, because they
  will be replaced automatically when you send a request with real values from the
  environment configured in the previous step. <br /><br /> ![postman - tutorial -
  7'
