name: CROssBAR Data API (ebi.ac.uk)
description: '# About CROssBAR & data **CROssBAR**: Comprehensive Resource of Biomedical Relations with
  Deep Learning Applications and Knowledge Graph Representations CROssBAR is a comprehensive system that
  integrates large-scale biomedical data from various resources e.g UniProt, ChEMBL, Drugbank, EFO, HPO,
  InterPro & PubChem and stores them in a new NoSQL database, enrich these data with deep learning based
  prediction of relations between numerous biomedical entities, rigorously analyse the enriched data to
  obtain biologically meaningful modules and display them to the user via easy to interpret, interactive
  and heterogeneous knowledge graphs. CROssBAR platform exposes a set of 12 endpoints to query data stored
  in the CROssBAR database. These endpoints help the user to find data of interest using different parameters
  provided by the API endpoint. For example, https://www.ebi.ac.uk/tools/crossbar/proteins?accession=A0A023GRW5
  -> will provide protein information about accession ''A0A023GRW5'' including its interactions, functions,
  cross-references, variations and more. https://www.ebi.ac.uk/tools/crossbar/activities?moleculeChemblId=CHEMBL465983
  -> will provide ChEMBL bio-interactions related information including targets and bio-activity measurements
  associated with molecule chembl id ''CHEMBL465983'' **Knowledge graphs** Another use case of CROssBAR''s
  API endpoints is in building knowledge graphs. These endpoints can be *weaved* together (output from
  one API endpoint fed as input to another API endpoint) programmatically to link nodes like protein,
  disease, drugs etc. as nodes of the graph. The endpoints are designed to be independent from each other
  which allows users the flexibility to drive biological networks from any facet e.g drug-centric, disease-centric,
  gene-centric etc. Our service for knowledge graph construction is available at https://crossbar.kansil.org.
  An example for the part of the background queries on the CROssBAR API during the construction of a knowledge
  graph,'
