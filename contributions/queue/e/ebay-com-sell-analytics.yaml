name: Seller Service Metrics API (ebay.com:sell-analytics)
description: 'The <i>Analytics API</i> provides data and information about a seller and their eBay business.
  <br><br>The resources and methods in this API let sellers review information on their listing performance,
  metrics on their customer service performance, and details on their eBay seller performance rating.
  <br><br>The three resources in the Analytics API provide the following data and information: <ul><li><b>Customer
  Service Metric</b> &ndash; Returns data on a seller''s customer service performance as compared to other
  seller''s in the same peer group.</li> <li><b>Traffic Report</b> &ndash; Returns data that shows how
  buyers are engaging with a seller''s listings.</li> <li><b>Seller Standards Profile</b> &ndash; Returns
  data pertaining to a seller''s performance rating.</li></ul> Sellers can use the data and information
  returned by the various Analytics API methods to determine where they can make improvements to increase
  sales and how they might improve their seller status as viewed by eBay buyers. <br><br>For details on
  using this API, see <a href="/api-docs/sell/static/performance/analyzing-performance.html" title="Selling
  Integration Guide">Analyzing seller performance</a>.'
