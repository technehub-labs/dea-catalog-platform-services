name: Subscriptions API (v3) (vtex.local:Subscriptions-API-(v3))
description: 'A **Subscription** is a list of items (SKUs) tied to certain recurring
  purchase settings: - User profile - Address - Payment method - Frequency - Cycle
  Once you have [configured subscriptions](https://help.vtex.com/tutorial/how-to-configure-subscriptions%20--1FA9dfE7vJqxBna9Nft5Sj)
  in your store, the Subscriptions API allows you to create, manage and monitor your
  customers'' subscriptions. ![image](https://user-images.githubusercontent.com/77292838/213024675-9407863b-0c55-4282-9442-306352716abe.png)
  To read more about the Subscriptions feature, check our article [How Subscription
  works](https://help.vtex.com/tutorial/how-subscriptions-work--frequentlyAskedQuestions_4453).'
