name: Veteran Confirmation (va.gov:confirmation)
description: 'The Veteran Confirmation API allows you to confirm Veteran status for a given person. This
  can be useful for offering Veterans discounts or other benefits. The API will only return “Confirmed”
  or “Not Confirmed”. ## Quickstart Guide ### 1. Get Access Credentials Get started by filling out the
  form on the [Apply for VA Lighthouse Developer Access](https://developer.va.gov/apply) page. After submitting
  a request, you will receive your credentials for using the API in the Development environment, which
  allows you to try it out with mock data before moving to the Production environment. ### 2. Test the
  API In the endpoint documentation below, we''ve provided a curl command builder for trying out the API
  before implementation with your app. Use [Test User](https://github.com/department-of-veterans-affairs/vets-api-clients/blob/master/test_accounts/confirmation_test_accounts.md)
  attributes to populate the request body. ### 3. Build your app The base URI for the Veteran Confirmation
  API in the Sandbox environment is: https://sandbox-api.va.gov/services/veteran_confirmation/v0 In this
  environment, use attributes from the list of [Test Users](https://github.com/department-of-veterans-affairs/vets-api-clients/blob/master/test_accounts/confirmation_test_accounts.md).
  Only Test Users can return a `"confirmed"` response. Check out some of our [sample apps](https://github.com/department-of-veterans-affairs/vets-api-clients).
  Please visit our VA Lighthouse [Support portal](https://developer.va.gov/support) should you need further
  assistance. ### 4. Show us a demo and get access to the Production environment After building your app,
  we ask that you give us a demo before we set you up with production credentials. Please see the [Path
  to Production](https://developer.va.gov/go-live) page for more details. ## Authorization This API requires
  an API key in combination with identifiable information for the person being confirmed listed below.
