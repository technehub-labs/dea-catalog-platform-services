description: 'Reviews & Ratings is a [VTEX IO native solution](https://developers.vtex.com/vtex-developer-docs/docs/vtex-reviews-and-ratings)
  that allows shoppers to submit reviews and ratings for products, as well as see them while navigating
  the store. ## Rating - [Get Product Rating](https://developers.vtex.com/vtex-rest-api/reference/getproductrating)
  ## Review - [Get Review by Review ID](https://developers.vtex.com/vtex-rest-api/reference/getreviewbyreviewid)
  - [Delete Review](https://developers.vtex.com/vtex-rest-api/reference/deletereview) - [Update a Review](https://developers.vtex.com/vtex-rest-api/reference/editreview)
  - [Get a list of Reviews](https://developers.vtex.com/vtex-rest-api/reference/getalistofreviews) - [Create
  Multiple Reviews](https://developers.vtex.com/vtex-rest-api/reference/savemultiplereviews) - [Delete
  Multiple Reviews](https://developers.vtex.com/vtex-rest-api/reference/deletemultiplereviews) - [Create
  a Review](https://developers.vtex.com/vtex-rest-api/reference/savereview)'
