name: Pricing Hub (vtex.local:Pricing-Hub)
description: '> This feature is in closed beta, available only for selected customers.
  If you have any questions, contact our [Support](https://support.vtex.com/hc/en-us/requests).
  In the B2B scenario, it is common for stores to have personalized prices per customer
  and complex pricing systems that require external integrations. Pricing Hub is a
  system developed for the B2B context that works as an intermediary between VTEX
  and external pricing systems. In VTEX, B2B stores have the option to use our internal
  pricing system or an external one. If the store chooses to operate with an external
  pricing system, Pricing Hub will query an external price calculation API. The external
  API should then respond with the price for all items in the shopping cart according
  to its predefined tax rules. ![Pricing hub protocal diagram](https://user-images.githubusercontent.com/77292838/211634260-e4f7a516-91df-416e-ab43-d9c79d56bc91.png)
  ## Implementation To connect with external pricing systems using Pricing Hub, it
  is necessary to build a VTEX IO middleware app. We offer two reference implementation
  templates to simplify this process: - [C# template](https://github.com/vtex-apps/external-prices-app)
  - [Node template](https://github.com/vtex-apps/external-prices-node) Read the documentation
  on each repository to learn more about the required steps to use and customize the
  app. > The app used by Pricing Hub to connect must be a `major 0`. ## Specifications
  See below all the specifications of the request and the response expected when communicating
  with Pricing Hub. ### Price calculation request The external prices calculation
  tool must provide an endpoint that will receive a `POST` [Get Prices](https://developers.vtex.com/docs/api-reference/pricing-hub#post-/api/pricing-hub/prices)
  request. This route retrieves and applies prices for the items that are passed in
  the request. Pricing Hub will select the pricing method that will be used for each
  item and will fetch their respective price from the sel'
