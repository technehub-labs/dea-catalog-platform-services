name: Marketplace Protocol (vtex.local:Marketplace-Protocol)
description: 'The _Marketplace Protocol_ is a set of API requests and definitions
  to help you integrate external sellers into a VTEX marketplace as well as external
  marketplaces into VTEX sellers. ## External Seller Here you will find the endpoints
  involved in the integration between a VTEX marketplace and an external seller. Note
  that some of these requests are typically sent by the seller while others are received.
  | **Request** | **From** | **To** | |-|-|-| | [Fulfillment simulation](https://developers.vtex.com/vtex-rest-api/reference/fulfillment-simulation)
  | Marketplace | Seller | | [Order placement](https://developers.vtex.com/vtex-rest-api/reference/order-placement)
  | Marketplace | Seller | | [Authorize fulfillment](https://developers.vtex.com/vtex-rest-api/reference/authorize-fulfillment)
  | Marketplace | Seller | | [Marketplace order cancellation](https://developers.vtex.com/vtex-rest-api/reference/marketplace-order-cancellation)
  | Marketplace | Seller | | [Send invoice](https://developers.vtex.com/vtex-rest-api/reference/send-invoice)
  | Seller | Marketplace | | [Send tracking information](https://developers.vtex.com/vtex-rest-api/reference/send-tracking-information)
  | Seller | Marketplace | | [Update tracking status](https://developers.vtex.com/vtex-rest-api/reference/update-tracking-status)
  | Seller | Marketplace | | [Cancel order in marketplace](https://developers.vtex.com/vtex-rest-api/reference/cancel-order-in-marketplace)
  | Seller | Marketplace | For a detailed explanation of the steps required to develop
  a custom connector to sell products from an external seller in your storefront,
  check out our complete [External Seller Integration Guide](https://developers.vtex.com/docs/guides/external-seller-integration-guide).
  ## External Marketplace In this section, you will find the endpoints involved in
  the VTEX integration between an external marketplace and a VTEX seller. | **Request**
  | **From** | **To** | |-|-|-| | [VTEX Mapper Registration](https://developers.vtex.com/'
