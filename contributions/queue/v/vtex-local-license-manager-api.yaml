description: '## Welcome! The License Manager API allows you to create users, modify their names and emails,
  as well as add and remove roles from users. ### ATTRIBUTES |Attribute name | Description | |:------------|--------------|
  |accountName | Account name in VTEX License Manager | |environment | Environment on which you want to
  run the query e.g. vtexcommercestable | |userId | Unique user identification string | |roleId | Integer
  that represents a role, can be looked up on the License Manager UI |'
