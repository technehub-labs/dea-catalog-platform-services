name: Trakt API (trakt.tv)
description: 'At Trakt, we collect lots of interesting information about what tv shows
  and movies everyone is watching. Part of the fun with such data is making it available
  for anyone to mash up and use on their own site or app. The Trakt API was made just
  for this purpose. It is very easy to use, you basically call a URL and get some
  JSON back. More complex API calls (such as adding a movie or show to your collection)
  involve sending us data. These are still easy to use, you simply POST some JSON
  data to a specific URL. Make sure to check out the [**Required Headers**](#introduction/required-headers)
  and [**Authentication**](#reference/authentication-oauth) sections for more info
  on what needs to be sent with each API call. Also check out the [**Terminology**](#introduction/terminology)
  section insight into the features Trakt supports. # Create an App To use the Trakt
  API, you''ll need to [**create a new API app**](https://trakt.tv/oauth/applications/new).
  # Stay Connected API discussion and bugs should be posted in the [**GitHub Developer
  Forum**](https://github.com/trakt/api-help/issues) and *watch* the repository if
  you''d like to get notifications. Make sure to follow our [**API Blog**](https://apiblog.trakt.tv)
  and [**@traktapi on Twitter**](https://twitter.com/traktapi) too. # API URL The
  API should always be accessed over SSL. ``` https://api.trakt.tv ``` If you would
  like to use our sandbox environment to not fill production with test data, use this
  URL over SSL. **Note:** Staging is a completely separate environment, so you''ll
  need to [**create a new API app on staging**](https://staging.trakt.tv/oauth/applications/new).
  ``` https://api-staging.trakt.tv ``` # Verbs The API uses restful verbs. | Verb
  | Description | |---|---| | `GET` | Select one or more items. Success returns `200`
  status code. | | `POST` | Create a new item. Success returns `201` status code.
  | | `PUT` | Update an item. Success returns `200` status code. | | `DELETE` | Delete
  an item. Success returns `2'
