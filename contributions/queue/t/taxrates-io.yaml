description: <h3>Introduction</h3> <p>Taxrates.io is a global tax rate service that
  automates the management of monitoring tax rates changes in 181 countries. We monitor
  over 14,000 US sales tax, VAT, GST rates for you and make updates via our API so
  you always have the most update tax rates.</p> <p>You can use Taxrates.io as a virtual
  sandbox where we provide you with 30 days free trial.</p> <h3>Countries</h3> <p>We
  currently support the following countries around the world. If you would like to
  request the addition of a new country, please email us at <a href="mailto:support@taxrates.io">support@taxrates.io</a></p>
