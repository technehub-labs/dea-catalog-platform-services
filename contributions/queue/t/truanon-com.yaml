name: TruAnon Private API (truanon.com)
description: 'Welcome to TruAnon! Thank you for helping make the Internet a safer place to be. Adopting
  TruAnon is simple. There is no setup or dependencies, nothing to store or process. Making identity part
  of your service is fun, and you’ll be up and running in a matter of minutes. TruAnon Private Token is
  used anytime you request information from TruAnon and you must edit this into the Variables section
  for this collection. This API contains two endpoints and both require these same two arguments, also
  found in the Variables section of this collection. These two arguments are: TruAnon Service Identifier
  and Your Member Name Your TruAnon Service Identifier was provided by TruAnon and is likely the root
  domain of your site or service. Your Member Name is the unique member ID on your system that you would
  like to query. Information is continuously updated for display purposes and aside from performance considerations,
  there should be no need to capture or save anything from TruAnon.'
