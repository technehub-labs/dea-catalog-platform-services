name: Fitbit Plus API (twinehealth.com)
description: '# Overview The Fitbit Plus API is a RESTful API. The requests and responses are formated
  according to the [JSON API](http://jsonapi.org/format/1.0/) specification. In addition to this documentation,
  we also provide an [OpenAPI](https://github.com/OAI/OpenAPI-Specification/blob/master/versions/2.0.md)
  "yaml" file describing the API: [Fitbit Plus API Specification](swagger.yaml). # Authentication Authentication
  for the Fitbit Plus API is based on the [OAuth 2.0 Authorization Framework](https://tools.ietf.org/html/rfc6749).
  Fitbit Plus currently supports grant types of **client_credentials** and **refresh_token**. See [POST
  /oauth/token](#operation/createToken) for details on the request and response formats. <!-- ReDoc-Inject:
  <security-definitions> --> ## Building Integrations We will provide customers with unique client credentials
  for each application/integration they build, allowing us to enforce appropriate access controls and
  monitor API usage. The client credentials will be scoped to the organization, and allow full access
  to all patients and related data within that organization. These credentials are appropriate for creating
  an integration that does one of the following: - background reporting/analysis - synchronizing data
  with another system (such as an EMR) The API credentials and oauth flows we currently support are **not**
  well suited for creating a user-facing application that allows a user (patient, coach, or admin) to
  login and have access to data which is appropriate to that specific user. It is possible to build such
  an application, but it is not possible to use Fitbit Plus as a federated identity provider. You would
  need to have a separate means of verifying a user''s identity. We do not currently support the required
  password-based oauth flow to make this possible. # Paging The Fitbit Plus API supports two different
  pagination strategies for GET collection endpoints. #### Skip-based paging Skip-based paging uses the
  query parameters `page[size]` and'
