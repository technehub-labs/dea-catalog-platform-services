name: Checks API (truora.com)
description: '**NOTE:** This is a preview of the API and it is not considered stable since refinements
  are still being made. # Introduction Welcome to the **Truora Check** [**RESTful API**](https://en.wikipedia.org/wiki/Representational_state_transfer)
  reference. You may also want to check out our [**Validations API docs**](https://docs.validations.truora.com/)
  or our [**Signals API docs**](https://docs.signals.truora.com/). Truora Check API allows performing
  full background checks on people, vehicles and companies. There are three main types of background checks:
  - **Personal background check**: Verifies national IDs in multiple databases of public and legal entities
  in the LATAM region. For every national ID, returns information on: personal identity, criminal records,
  international background check, and professional background. - **Vehicle background check**: Verifies
  the vehicle documents and the owner identity in multiple databases of public and legal entities in the
  LATAM region. For every vehicle and owner type, returns information on: personal identity, driving records,
  criminal records, and vehicle information. - **Company background check**: Verifies the tax ID or a
  company name in multiple databases of public and legal entities in the LATAM region. For every company,
  returns the associated: business status, legal and criminal records, and media reports. # API Key V1
  is live! API key version 1 is now live. Users with version 0 API keys are not immediately required to
  upgrade to V1 but should plan to do so at their earliest convenience. The changes for integration with
  API keys v1 are as follows: - The field ``user_authorized`` is now required to perform person checks.
  This field indicates the API user has authorization to perform the check in compliance with data protection
  law. - The field ``homonym_scores`` is no longer included in our person check response as its results
  are already included in the body of the check and keeping them duplicated is generating unnecessa'
