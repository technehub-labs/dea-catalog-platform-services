name: Health ID Service (ndhm.gov.in:ndhm-healthid)
description: It is important to standardize the process of identification of an individual across healthcare
  providers, to ensure that the created medical records are issued to the right individual or accessed
  by a Health Information User through appropriate consent. In order to issue a Health ID to an individual,
  one only needs basic demographic details like Name, Year of Birth, Gender. In addition, citizens should
  be able to update contact information easily.
