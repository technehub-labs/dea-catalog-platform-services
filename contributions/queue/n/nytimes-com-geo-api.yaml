name: Geographic API (nytimes.com:geo_api)
description: The Geographic API extends the Semantic API, using a linked data approach to enhance location
  concepts used in The New York Times' controlled vocabulary and data resources which combine them with
  the GeoNames database, an authoritative and free to use database of global geographical places, names
  and features.
