name: IoTVAS API (firmalyzer.com:iotvas)
description: IOTVAS API enables you to discover IoT/Connected devices in the network and provides detailed
  real-time risk analysis, including firmware vulnerability analysis without requiring the user to upload
  the firmware file. Please visit the [signup page](https://iotvas-api.firmalyzer.com/portal/signup) to
  create an API key. IoTVAS API can be easily integrated with vulnerability scanning and network port
  scanner tools. For example, we have also released the [IOTVAS NSE script](https://github.com/firmalyzer/iotvas-nmap)
  that turns the nmap port scanner to a IoT/connected device discovery and real-time risk assessment tool.
  For more infromation on IoTVAS and other solutions please visit [Firmalyzer web site](https://www.firmalyzer.com).
