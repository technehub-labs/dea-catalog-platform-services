name: Bank Feeds API (codat.io:bank-feeds)
description: Bank Feeds API enables your SMB users to set up bank feeds from accounts in your application
  to supported accounting platforms. A bank feed is a connection between a source bank account—in your
  application—and a target bank account in a supported accounting package. [Read more...](https://docs.codat.io/bank-feeds-api/overview)
