name: PeerTube (cpy.re:peertube)
description: 'The PeerTube API is built on HTTP(S) and is RESTful. You can use your
  favorite HTTP/REST library for your programming language to use PeerTube. The spec
  API is fully compatible with [openapi-generator](https://github.com/OpenAPITools/openapi-generator/wiki/API-client-generator-HOWTO)
  which generates a client SDK in the language of your choice - we generate some client
  SDKs automatically: - [Python](https://framagit.org/framasoft/peertube/clients/python)
  - [Go](https://framagit.org/framasoft/peertube/clients/go) - [Kotlin](https://framagit.org/framasoft/peertube/clients/kotlin)
  See the [REST API quick start](https://docs.joinpeertube.org/api/rest-getting-started)
  for a few examples of using the PeerTube API. # Authentication When you sign up
  for an account on a PeerTube instance, you are given the possibility to generate
  sessions on it, and authenticate there using an access token. Only __one access
  token can currently be used at a time__. ## Roles Accounts are given permissions
  based on their role. There are three roles on PeerTube: Administrator, Moderator,
  and User. See the [roles guide](https://docs.joinpeertube.org/admin/managing-users#roles)
  for a detail of their permissions. # Errors The API uses standard HTTP status codes
  to indicate the success or failure of the API call, completed by a [RFC7807-compliant](https://tools.ietf.org/html/rfc7807)
  response body. ``` HTTP 1.1 404 Not Found Content-Type: application/problem+json;
  charset=utf-8 { "detail": "Video not found", "docs": "https://docs.joinpeertube.org/api/rest-reference.html#operation/getVideo",
  "status": 404, "title": "Not Found", "type": "about:blank" } ``` We provide error
  `type` values for [a growing number of cases](https://github.com/Chocobozzz/PeerTube/blob/develop/shared/models/server/server-error-code.enum.ts),
  but it is still optional. Types are used to disambiguate errors that bear the same
  status code and are non-obvious: ``` HTTP 1.1 403 Forbidden Content-Type: application/problem+json;
  char'
