name: Climate FieldView Platform APIs (climate.com)
description: '**Last Modified**: Wed Jan 4 12:47:29 UTC 2023 All endpoints are only
  accessible via HTTPS. * All API endpoints are located at `https://platform.climate.com`
  (e.g. `https://platform.climate.com/v4/fields`). * The authorization token endpoint
  is located at `https://api.climate.com/api/oauth/token`. ## Troubleshooting `X-Http-Request-Id`
  response header will be returned on every call, successful or not. If you experience
  an issue with our api and need to contact technical support, please supply the value
  of the `X-Http-Request-Id` header along with an approximate time of when the request
  was made. ## Request Limits When you’re onboarded to Climate’s API platform, your
  `x-api-key` is assigned a custom usage plan. Usage plans are unique to each partner
  and have the following key attributes: 1. Throttling information * burstLimit: Maximum
  rate limit over a period ranging from 1 second to a few seconds * rateLimit: A steady-state
  rate limit 2. Quota information * Limit: The maximum number of requests that can
  be made in a given month When the request rate threshold is exceeded, a `429` response
  code is returned. Optionally, the [`Retry-After`](https://www.w3.org/Protocols/rfc2616/rfc2616-sec14.html#sec14.37)
  header may be returned: Following are examples of rate limit errors: 1. Rate limit
  exceeded: <br>HTTP/1.1 429 <br>Content-Type: application/json <br>Content-Length:
  32 {"message":"Too Many Requests"} 2. Quota exhausted: <br>HTTP/1.1 429 <br>Content-Type:
  application/json <br>Content-Length: 29 {"message":"Limit Exceeded"} ## Pagination
  Pagination is performed via headers. Any request which returns a `"results"` array
  may be paginated. The following figure shows how query results are laid out with
  X-Limit=4 and no filter applied. <img style="width:70%;height:auto;" src="https://s3-us-west-2.amazonaws.com/climate-com/images/svg_upload_tests/paging.png">
  * If there are no results, a response code of `304` will be returned. * If the response
  is the last set of results, a '
