name: Word Associations API (wordassociations.net)
description: The Word Associations Network API allows developers to embed the ability to find associations
  for a word or phrase into their mobile apps or web services. Words are grouped by semantics, meaning,
  and psychological perception. The Word Associations Network API currently supports English, French,
  Spanish, German, Italian, Portuguese, and Russian vocabulary. Please [register and subscribe](https://api.wordassociations.net/subscriptions/)
  to one of available tariff plans to get a valid API key.
