name: Wowza Streaming Cloud REST API Reference Documentation (wowza.com)
description: '# About the REST API The Wowza Streaming Cloud<sup>TM</sup> REST API (application programming
  interface) offers complete programmatic control over live streams, transcoders, stream sources, and
  stream targets. Anything you can do in the Wowza Streaming Cloud UI can also be achieved by making HTTP-based
  requests to cloud-based servers through the REST API. The Wowza Streaming Cloud REST API features *cross-origin
  resource sharing*, or CORS. CORS is a [W3C specification](https://www.w3.org/TR/cors/) that provides
  headers in HTTP requests to enable a web server to safely make a network request to another domain.
  In order to protect shared resources, the Wowza Streaming Cloud REST API is subject to limits. For details,
  see [Wowza Streaming Cloud REST API limits](https://www.wowza.com/docs/wowza-streaming-cloud-rest-api-limits).
  # About this documentation This reference documentation is based on the open-source [Swagger framework](http://swagger.io/specification/).
  It allows you to view the operations, parameters, and request and reponse schemas for every resource.
  Request samples are presented in cURL (Shell) and JavaScript; some samples also include just the JSON
  object. Response samples are all JSON. For more information and examples on using the Wowza Streaming
  Cloud REST API, see our [library of Wowza Streaming Cloud REST API technical articles](https://www.wowza.com/docs/wowza-streaming-cloud-rest-api).
  # Query requirements The Wowza Streaming Cloud REST API uses HTTP requests to retrieve data from cloud-based
  servers. Requests must contain proper JSON, two authentication keys, and the correct version number
  in the base path. ## JSON The Wowza Streaming Cloud REST API uses the [JSON API specification](http://jsonapi.org/format/)
  to request and return data. This means requests must include the header `Content-Type: application/json`
  and must include a single resource object in JSON format as primary data. Responses include HTTP status
