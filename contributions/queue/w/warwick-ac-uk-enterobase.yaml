name: Enterobase-API (warwick.ac.uk:enterobase)
description: 'API for EnteroBase (https://enterobase.warwick.ac.uk) EnteroBase is a user-friendly online
  resource, where users can upload their own sequencing data for de novo assembly by a stream-lined pipeline.
  The assemblies are used for calling MLST and wgMLST patterns, allowing users to compare their strains
  to publically available genotyping data from other EnteroBase users, GenBank and classical MLST databases.
  Click here to find how to get and use an API token: http://bit.ly/1TKlaOU'
