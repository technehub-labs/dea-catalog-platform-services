name: Postman API (getpostman.com)
description: 'The Postman API allows you to programmatically access data stored in
  Postman account with ease. The easiest way to get started with the API is to click
  the **fork** button to fork this collection to your own workspace and use Postman
  to send requests. # Overview 1. You need a valid <a href="#authentication">API Key</a>
  to send requests to the API endpoints. You can get your key from the [integrations
  dashboard](https://go.postman.co/settings/me/api-keys). 1. The API has an access
  <a href="#rate-limits">rate limit</a> applied to it. 1. The Postman API will only
  respond to secured communication done over HTTPS. HTTP requests will be sent a `301`
  redirect to corresponding HTTPS resources. 1. Response to every request is sent
  in [JSON format](https://en.wikipedia.org/wiki/JSON). In case the API request results
  in an error, it is represented by an `"error": {}` key in the JSON response. 1.
  The request method (verb) determines the nature of action you intend to perform.
  A request made using the `GET` method implies that you want to fetch something from
  Postman, and `POST` implies you want to save something new to Postman. 1. The API
  calls will respond with appropriate [HTTP status codes](https://en.wikipedia.org/wiki/List_of_HTTP_status_codes)
  for all requests. Within Postman Client, when a response is received, the status
  code is highlighted and is accompanied by a help text that indicates the possible
  meaning of the response code. A `200 OK` indicates all went well, while `4XX` or
  `5XX` response codes indicate an error from the requesting client or our API servers
  respectively. 1. Individual resources in your Postman Account is accessible using
  its unique id (`uid`). The `uid` is a simple concatenation of the resource owner''s
  user-id and the resource-id. For example, a collection''s `uid` is `{{owner_id}}-{{collection_id}}`.
  # Authentication An API Key is required to be sent as part of every request to the
  Postman API, in the form of an `X-Api-Key` request header. > If y'
