name: GoToTraining (getgo.com:gototraining)
description: The GoToTraining API enables developers to use the stable and robust
  GoToTraining functionality as the basis for online trainings in a proprietary learning
  management system. The GoToTraining APIs provide the ability to access the scheduling,
  registration, management, and reporting functions of GoToTraining from external
  applications. With the ability to tightly integrate GoToTraining into your learning
  infrastructure, you can offer your learners a seamless user experience and provide
  them with a market leading virtual classroom environment.
