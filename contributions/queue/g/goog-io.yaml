description: '# Intoduction This is the OpenAPI V3 documentation for https://api.goog.io
  An API to perform Google Searches. Extremely fast and accurate. Zero proxies. Clean
  USA IPs. Simple to use API, but advance enough to support special parameters such
  as languages, country and geographic locality. Googio is the ultimate search API
  for Google Searches, Google News, and Google SERP. # Docs > An Unofficial Google
  Search API An API to perform Google Searches. Extremely fast and accurate. Zero
  proxies. Clean USA IPs. Simple to use API, but advance enough to support special
  parameters such as languages, country and geographic locality. # Example Code Check
  out [Github repo](https://github.com/googio/googio_examples) for example code for
  calling the API with various languages. # Authentication ### API Key Optional API
  key for authenticated access. Note that we use "API key" interchangably in these
  docs. Authenticated requests must include an `apikey` header containing your subscription''s
  API Key. | Security Schema Type | Header Name | Example Token | | --- | --- | ---
  | | API Key | `apikey` | c5bfb018-ab46-4e61-9271-4ec7e9c04a6e | In the following
  example, `YOU_APIKEY` represents the auth token for your account. ``` curl --header
  ''apikey: YOU_APIKEY'' ``` You can view and manage your API keys in the [Dashboard](/dashboard).
  Be sure to keep your API keys secure. Do not share them in publicly accessible areas
  such as GitHub, client-side code, and so forth. Also note that all API requests
  must be made over **HTTPS**. Calls made over plain HTTP will attempt to be automatically
