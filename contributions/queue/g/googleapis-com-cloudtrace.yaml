name: Cloud Trace API (googleapis.com:cloudtrace)
description: Sends application trace data to Cloud Trace for viewing. Trace data is
  collected for all App Engine applications by default. Trace data from other applications
  can be provided using this API. This library is used to interact with the Cloud
  Trace API directly. If you are looking to instrument your application for Cloud
  Trace, we recommend using OpenTelemetry.
