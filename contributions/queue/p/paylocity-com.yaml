name: Paylocity API (paylocity.com)
description: 'For general questions and support of the API, contact: webservices@paylocity.com # Overview
  Paylocity Web Services API is an externally facing RESTful Internet protocol. The Paylocity API uses
  HTTP verbs and a RESTful endpoint structure. OAuth 2.0 is used as the API Authorization framework. Request
  and response payloads are formatted as JSON. Paylocity supports v1 and v2 versions of its API endpoints.
  v1, while supported, won''t be enhanced with additional functionality. For direct link to v1 documentation,
  please click [here](https://docs.paylocity.com/weblink/guides/Paylocity_Web_Services_API/v1/Paylocity_Web_Services_API.htm).
  For additional resources regarding v1/v2 differences and conversion path, please contact webservices@paylocity.com.
  ##### Setup Paylocity will provide the secure client credentials and set up the scope (type of requests
  and allowed company numbers). You will receive the unique client id, secret, and Paylocity public key
  for the data encryption. The secret will expire in 365 days. * Paylocity will send you an e-mail 10
  days prior to the expiration date for the current secret. If not renewed, the second e-mail notification
  will be sent 5 days prior to secret''s expiration. Each email will contain the code necessary to renew
  the client secret. * You can obtain the new secret by calling API endpoint using your current not yet
  expired credentials and the code that was sent with the notification email. For details on API endpoint,
  please see Client Credentials section. * Both the current secret value and the new secret value will
  be recognized during the transition period. After the current secret expires, you must use the new secret.
  * If you were unable to renew the secret via API endpoint, you can still contact Service and they will
  email you new secret via secure email. When validating the request, Paylocity API will honor the defaults
  and required fields set up for the company default New Hire Template as defined in Web Pay. # Authorization
  Pa'
