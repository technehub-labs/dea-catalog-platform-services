name: IBM Containers API (bluemix.net:containers)
description: 'Containers are virtual software objects that include all the elements
  that an app needs to run. A container has the benefits of resource isolation and
  allocation but is more portable and efficient than, for example, a virtual machine.
  This documentation describes the IBM Containers API, which is based on the Docker
  Remote API. The API provides endpoints that you can use to create and manage your
  single containers and container groups in Bluemix. Endpoints are summarized under
  the following tags: - **Authentication**: Retrieve and refresh your TLS certificates.
  - **Private Docker images registry**: Create your own private Docker images registry
  in Bluemix by setting a namespace for your organization. - **Images**: View, build,
  and push your images to your private Bluemix registry so you can use them with IBM
  Containers. You can also scan your container images with the Vulnerability Advisor
  against standard policies set by the organization manager and a database of known
  Ubuntu issues. - **Single Containers**: Create and manage single containers in Bluemix.
  Use a single container to implement short-lived processes or to run simple tests
  as you develop an app or service. To make your single container available from the
  internet, review the `Public IP addresses` endpoints. - **Container Groups**: Create
  and manage your container groups in Bluemix. A container group consists of multiple
  single containers that are all created from the same container image and as a consequence
  are configured in the same way. Container groups offer further options at no cost
  to make your app highly available. These options include in-built load balancing,
  auto-recovery of unhealthy container instances, and auto-scaling of container instances
  based on CPU and memory usage. Map a public route to your container group to make
  your app accessible from the internet. - **Public IP addresses**: Use these endpoints
  to request public IP addresses for your space. You can bind this IP address to your
  c'
