  update your applications accordingly. Check here: <https://github.com/bunq/sdk_php/issues/149> for more
  info.* ***PSD2 NOTICE:*** *The second Payment Services Directive (PSD2) may affect your current or planned
  usage of our public API, as some of the API services are now subject to a permit. Please be aware that
  using our public API without the required PSD2 permit is at your own risk and take notice of our updated
  API Terms and Conditions on <https://www.bunq.com> for more information.* # <span id="topic-introduction">Introduction</span>
  Welcome to bunq! - The bunq API is organised around REST. JSON will be returned in almost all responses
  from the API, including errors but excluding binary (image) files. - Please configure your implementation
  to send its API requests to `https://public-api.sandbox.bunq.com/v1/` - There is a version of the [Android
  app](https://appstore.bunq.com/api/android/builds/bunq-android-sandbox-master.apk) that connects to
  the bunq Sandbox environment. To create accounts for the Sandbox app, please follow the steps in the
  [Android Emulator](#android-emulator) section. ## <span id="topic-introduction-get-started">Getting
