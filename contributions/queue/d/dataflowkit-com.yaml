description: 'Render Javascript driven pages, while we internally manage Headless
  Chrome and proxies for you. - Build a custom web scraper with our Visual point-and-click
  toolkit. - Scrape the most popular Search engines result pages (SERP). - Convert
  web pages to PDF and capture screenshots. *** ### Authentication Dataflow Kit API
  require you to sign up for an API key in order to use the API. The API key can be
  found in the [DFK Dashboard](https://account.dataflowkit.com) after _free registration_.
  Pass a secret API Key to all API requests to the server as the `api_key` query parameter.'
