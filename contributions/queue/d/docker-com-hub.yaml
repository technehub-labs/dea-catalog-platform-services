description: Docker Hub is a service provided by Docker for finding and sharing container images with
  your team. It is the world's largest library and community for container images. In addition to the
  [Docker Hub UI](https://docs.docker.com/docker-hub/) and [Docker Hub CLI tool](https://github.com/docker/hub-tool#readme)
  (currently experimental), Docker provides an API that allows you to interact with Docker Hub. Browse
  through the Docker Hub API documentation to explore the supported endpoints.
