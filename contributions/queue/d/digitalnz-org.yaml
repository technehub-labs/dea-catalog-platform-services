description: OpenAPI specification of DigitalNZ's Record API. For more information
  about the API see [digitalnz.org/developers](https://digitalnz.org/developers).
  To learn more about the metadata/fields used in the API see the [Metadata Dictionary](https://docs.google.com/document/pub?id=1Z3I_ckQWjnQQ4SzpORbClcIXUheO-Jd4jt-oZFuMcoQ).
  To get a sense of what content is available via the API take a look at the search
  feature on the [DigitalNZ website](https://digitalnz.org/records?text=all%20sorts&tab=Images).
  The [terms of use](https://digitalnz.org/about/terms-of-use/developer-api-terms-of-use)
  specify how developers can use the DigitalNZ API.
